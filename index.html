<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>The Sacred Mount — Rome, 494 BC</title>
<style>
:root{--ink:#2a1d15;--paper:#efe3c8;--panel:#f8efdc;--hud:#f3e8d2;--cell:#ead8b4;
 --rust:#8a2b1d;--bronze:#7a5a1e;--dim:#6b5844;--line:rgba(42,29,21,.32);}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:#120c08;color:var(--ink);font-family:Georgia,'Times New Roman',serif;
 display:flex;align-items:center;justify-content:center;min-height:100vh;padding:8px;}
#stage{width:100%;max-width:680px;background:var(--paper);border:4px solid var(--ink);
 box-shadow:0 12px 44px rgba(0,0,0,.75);display:flex;flex-direction:column;
 max-height:97vh;overflow:hidden;position:relative;}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;}

header{background:var(--hud);border-bottom:2px solid var(--ink);padding:6px 7px 7px;flex:0 0 auto;}
.mast{display:flex;justify-content:space-between;align-items:center;gap:6px;
 border-bottom:1px solid var(--line);padding-bottom:3px;margin-bottom:5px;}
.mast h1{font-size:9.5px;letter-spacing:2.2px;text-transform:uppercase;color:var(--rust);font-weight:700;}
.mast span{font-size:8.5px;letter-spacing:1.4px;text-transform:uppercase;color:#4a3b2c;text-align:right;}
.voices{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-bottom:4px;}
.vc{background:var(--cell);border:1px solid var(--line);padding:2px 1px 3px;text-align:center;}
.vc .who{font-size:6.8px;font-weight:700;text-transform:uppercase;color:#4a3d2e;display:block;line-height:1.15;}
.vc .mood{font-size:9px;margin-top:1px;}
.vc .mood i{font-style:normal;font-size:11px;}
.vc .mood u{text-decoration:none;font-size:6.8px;text-transform:uppercase;display:block;
 font-family:ui-monospace,Menlo,monospace;}
.meters{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;}
.mt{background:#e2cda2;border:1px solid var(--line);padding:2px 1px 3px;text-align:center;}
.mt .who{font-size:6.6px;font-weight:700;text-transform:uppercase;color:var(--rust);display:block;line-height:1.1;}
.mt .num{font-size:13px;font-weight:700;font-family:ui-monospace,Menlo,monospace;}
.mt .dl{font-size:7.6px;height:10px;font-family:ui-monospace,Menlo,monospace;color:#8c2f22;}
.mt.up .dl{color:#2f5d34;}
.mt.warn{background:#e8b9a3;border-color:#8c2f22;}
#strip{margin-top:5px;border:1px solid var(--line);background:#e9dcbc;}
#strip svg{display:block;width:100%;height:auto;}
@media(max-width:430px){.mast h1{font-size:8px;letter-spacing:1.2px;}.mast span{font-size:7.4px;letter-spacing:.9px;}}
@media(max-width:340px){.mast h1{font-size:7px;letter-spacing:.6px;}.mast span{font-size:6.6px;letter-spacing:.4px;}}

main{flex:0 0 auto;height:216px;background:var(--paper);overflow:hidden;border-bottom:3px solid var(--ink);}
@media(min-width:520px){main{height:262px;}}
main svg{display:block;width:100%;height:100%;}

section{background:var(--panel);padding:9px 11px 12px;flex:1 1 auto;overflow-y:auto;}
.tags{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:4px;}
.tags b{font-size:10.5px;letter-spacing:2px;text-transform:uppercase;color:var(--rust);}
.tags span{font-size:8px;letter-spacing:1.2px;text-transform:uppercase;color:#6e5944;
 font-family:ui-monospace,Menlo,monospace;white-space:nowrap;}
#say{font-size:13.8px;line-height:1.52;white-space:pre-wrap;}
#say em{color:#4a2c1a;}
.hr{border-top:1px solid var(--line);margin:8px 0 7px;}
.gl{border-bottom:2px dotted var(--rust);cursor:pointer;color:#5c3218;}
#stage :focus-visible{outline:3px solid #8a2b1d;outline-offset:2px;}
.gl:after{content:'?';font-size:8px;vertical-align:super;color:var(--rust);}
#def{display:none;margin:7px 0 0;padding:7px 9px;background:#ead9b2;
 border-left:4px solid var(--rust);font-size:12.4px;line-height:1.42;}
#def b{text-transform:uppercase;letter-spacing:1px;font-size:10px;}
.sense{display:block;margin:8px 0 2px;padding:6px 9px;border-left:3px solid var(--bronze);
 background:#efe0bd;font-size:12.2px;font-style:italic;line-height:1.45;white-space:normal;}

.btn{display:block;width:100%;text-align:left;background:#fffdf8;border:2px solid var(--ink);
 box-shadow:3px 3px 0 var(--ink);padding:8px 10px;margin-bottom:7px;cursor:pointer;font-family:inherit;color:var(--ink);}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink);}
.btn b{display:block;font-size:12.8px;color:var(--rust);margin-bottom:3px;}
.btn i{display:block;font-size:10.8px;color:#594838;line-height:1.36;font-style:normal;}
.btn .pro{color:#3a6436;} .btn .con{color:#8c1d15;}
.btn.locked{background:#ece3d0;border-style:dashed;box-shadow:none;cursor:not-allowed;}
.btn.locked b{color:#6b5c44;}
.go{background:var(--rust);color:#fdf6e6;border:2px solid var(--ink);box-shadow:3px 3px 0 var(--ink);
 padding:9px 0;width:100%;font-family:inherit;font-size:11px;font-weight:700;
 letter-spacing:2px;text-transform:uppercase;cursor:pointer;}
.go:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink);}
.go:disabled{opacity:.42;box-shadow:none;}

/* builder: the demands and the bronze */
.grp{font-size:8.6px;letter-spacing:1.6px;text-transform:uppercase;color:var(--rust);margin:7px 0 4px;font-weight:700;}
.terms{display:grid;grid-template-columns:1fr;gap:5px;}
@media(min-width:520px){.terms{grid-template-columns:1fr 1fr;}}
.tm{border:2px solid #382c21;background:#f4ecd8;padding:5px 7px;cursor:pointer;display:flex;gap:6px;}
.tm.on{background:#fbe9cf;border-color:var(--rust);box-shadow:2px 2px 0 var(--rust);}
.tm.off{opacity:.5;}
.tm .bx{flex:0 0 13px;height:13px;border:2px solid #382c21;margin-top:2px;background:#fff;
 font-size:9px;line-height:9px;text-align:center;color:var(--rust);font-weight:700;}
.tm b{display:block;font-size:11.2px;line-height:1.22;}
.tm i{display:block;font-size:9.6px;color:#594d40;line-height:1.3;margin-top:1px;font-style:normal;}
.ask{margin-top:8px;border:2px solid var(--ink);background:#f4ecd8;padding:6px 8px;}
.ask b{display:block;font-size:8.4px;letter-spacing:1.4px;text-transform:uppercase;color:var(--rust);}
.ask .bar{display:block;font-family:ui-monospace,Menlo,monospace;font-size:13px;letter-spacing:1px;margin:2px 0 3px;}
.ask i{display:block;font-size:10.8px;line-height:1.35;font-style:italic;}
.ask.thin{background:#f7e0dc;border-color:#a3231a;} .ask.thin .bar,.ask.thin i{color:#8c1d15;}
.ask.fair{background:#e6ecd8;border-color:#5c7a4a;} .ask.fair .bar{color:#3a6436;}
.ask.heavy{background:#f7ead3;border-color:#a8641c;} .ask.heavy .bar{color:#8a5115;}
.ask.huge{background:#f7e0dc;border-color:#a3231a;} .ask.huge .bar,.ask.huge i{color:#8c1d15;}
.wsbox{margin-top:8px;border:1px solid var(--line);background:var(--cell);display:flex;}
.wstext{flex:1;padding:6px 8px;}
.wstext b{display:block;font-size:8px;letter-spacing:1.4px;text-transform:uppercase;color:var(--rust);}
.wstext p{font-size:11.2px;font-style:italic;line-height:1.36;margin-bottom:5px;}
.wstext p:last-child{margin-bottom:0;}
.wsfaces{flex:0 0 96px;border-left:1px solid var(--line);padding:5px 4px;
 display:flex;gap:5px;justify-content:center;background:#e2d0a8;}
.wsface{text-align:center;}
.wsface svg{width:38px;height:38px;border:2px solid var(--ink);background:#f6ecd6;border-radius:50%;}
.wsface span{display:block;font-size:6.6px;text-transform:uppercase;letter-spacing:.4px;
 margin-top:2px;color:#4a3d2e;font-family:ui-monospace,Menlo,monospace;}

/* the bronze tablets */
.tab{border:2px solid #5a4214;background:linear-gradient(#d7b56e,#c49a4c);padding:6px 8px;
 margin-bottom:6px;cursor:pointer;color:#2a1d0c;box-shadow:inset 0 0 0 1px #f0d898;}
.tab.on{background:linear-gradient(#efd9a0,#dcb464);border-color:var(--rust);box-shadow:2px 2px 0 var(--rust),inset 0 0 0 1px #fff2c8;}
.tab.off{opacity:.55;cursor:not-allowed;}
.tab .th{display:flex;justify-content:space-between;gap:6px;align-items:baseline;}
.tab .th b{font-size:8.4px;letter-spacing:1.6px;text-transform:uppercase;font-family:ui-monospace,Menlo,monospace;}
.tab .th span{font-size:8.4px;font-family:ui-monospace,Menlo,monospace;font-weight:700;white-space:nowrap;}
.tab .tt{font-size:11.6px;font-weight:700;margin:2px 0 3px;}
.tab .w{display:block;font-size:10.4px;line-height:1.34;padding-left:7px;border-left:2px solid rgba(42,29,12,.35);margin-top:3px;}
.tab .w.f{font-style:italic;} .tab.on .w.f{text-decoration:line-through;opacity:.6;}
.tab .w.p{opacity:.65;} .tab.on .w.p{opacity:1;font-weight:700;}
.tab .fix{display:block;font-size:9.6px;margin-top:4px;color:#5a1a10;font-style:italic;}

#ovl{display:none;position:absolute;inset:10px;z-index:40;background:rgba(246,238,220,.985);
 border:3px solid var(--ink);padding:11px;overflow-y:auto;box-shadow:0 8px 30px rgba(0,0,0,.45);}
#ovl .head{display:flex;justify-content:space-between;align-items:baseline;
 border-bottom:2px solid var(--ink);padding-bottom:4px;margin-bottom:8px;}
#ovl .head b{font-size:10.5px;letter-spacing:2px;text-transform:uppercase;color:var(--rust);}
#ovl .head span{font-size:7.6px;text-transform:uppercase;color:#544331;font-family:ui-monospace,Menlo,monospace;}
.card{border:2px solid;padding:6px 7px;margin-bottom:6px;display:flex;gap:8px;
 animation:slam .3s cubic-bezier(.18,.89,.32,1.28) both;}
@keyframes slam{0%{transform:scale(.88) translateY(12px);opacity:0}100%{transform:none;opacity:1}}
.card .fc{flex:0 0 44px;}
.card .fc svg{width:44px;height:44px;border:2px solid var(--ink);background:#f6ecd6;border-radius:50%;}
.card .bd{flex:1;}
.card .rw{display:flex;justify-content:space-between;align-items:baseline;gap:6px;margin-bottom:2px;}
.card .nm{font-size:9px;font-weight:700;text-transform:uppercase;line-height:1.15;}
.card .bnd{font-size:9.4px;font-weight:700;font-family:ui-monospace,Menlo,monospace;white-space:nowrap;}
.card q{display:block;font-size:11.6px;font-style:italic;line-height:1.38;quotes:none;}
.card q:before,.card q:after{content:'';}
.f-FURIOUS{background:#f7e0dc;border-color:#a3231a;} .f-FURIOUS .bnd,.f-FURIOUS .nm{color:#8c1d15;}
.f-ANGRY{background:#f7ead3;border-color:#a8641c;} .f-ANGRY .bnd,.f-ANGRY .nm{color:#8a5115;}
.f-COLD{background:#e5e8ea;border-color:#5b6770;} .f-COLD .bnd,.f-COLD .nm{color:#3f4950;}
.f-GRUDGING{background:#e8ecdc;border-color:#5c7a4a;} .f-GRUDGING .bnd,.f-GRUDGING .nm{color:#3f6b3a;}
.f-CHEERING{background:#dff0e5;border-color:#2f7d5c;} .f-CHEERING .bnd,.f-CHEERING .nm{color:#22664a;}
.yell{animation:yell .36s infinite ease-in-out;}
@keyframes yell{0%,100%{transform:rotate(0)}25%{transform:rotate(-5deg)}75%{transform:rotate(5deg)}}
#record{border-top:1px dashed var(--line);margin-top:2px;padding-top:6px;font-size:10.8px;line-height:1.44;color:#4a3b2c;}
#record b{font-size:8.4px;letter-spacing:1.4px;text-transform:uppercase;color:var(--rust);}

/* deal document and act-end annals */
.doc{background:#fffdf3;border:3px double var(--ink);padding:12px 14px;margin-bottom:9px;white-space:normal;}
.doc h4{text-align:center;font-size:12px;letter-spacing:2.4px;text-transform:uppercase;color:var(--rust);margin-bottom:2px;}
.doc .dt{text-align:center;font-size:8.6px;letter-spacing:1.4px;color:var(--dim);margin-bottom:9px;}
.doc .it{display:flex;gap:8px;padding:5px 0;border-bottom:1px dotted var(--line);}
.doc .it:last-child{border-bottom:none;}
.doc .it .k{flex:1;font-size:11.8px;}
.doc .it .v{flex:0 0 112px;text-align:right;font-size:9.6px;font-weight:700;
 font-family:ui-monospace,Menlo,monospace;text-transform:uppercase;}
.v.yes{color:#2f6b3a;} .v.no{color:#8c1d15;} .v.na{color:#7a6d54;font-weight:400;}
.news{white-space:normal;margin-bottom:11px;padding-bottom:9px;border-bottom:1px solid var(--line);}
.news .nh{font-size:7.8px;letter-spacing:1.5px;text-transform:uppercase;color:#6e5944;
 font-family:ui-monospace,Menlo,monospace;border-bottom:2px solid var(--ink);padding-bottom:4px;margin-bottom:8px;}
.news p{font-size:12.8px;line-height:1.52;margin-bottom:7px;}
.news p+p{text-indent:14px;}
.news blockquote{margin:8px 0 8px 10px;padding-left:9px;border-left:3px solid var(--rust);}
.news blockquote q{display:block;font-size:12.4px;font-style:italic;line-height:1.42;quotes:none;}
.news blockquote q:before,.news blockquote q:after{content:'';}
.news blockquote cite{display:block;font-size:9.4px;font-style:normal;margin-top:3px;letter-spacing:.6px;
 text-transform:uppercase;color:#6e5944;font-family:ui-monospace,Menlo,monospace;}
.news blockquote.qa{border-left-color:#5b6770;}
.rec{margin-top:11px;border-top:2px solid var(--ink);padding-top:7px;white-space:normal;}
.rec>b{display:block;font-size:8.6px;letter-spacing:1.8px;text-transform:uppercase;color:var(--rust);margin-bottom:5px;}
.ri{border-bottom:1px dotted var(--line);padding:4px 0;}
.ri:last-child{border-bottom:none;}
.ri .rw{display:block;font-size:7.8px;letter-spacing:1.2px;text-transform:uppercase;color:#6e5944;font-family:ui-monospace,Menlo,monospace;}
.ri .rd{display:block;font-size:11.8px;line-height:1.34;}
.ri .rf{display:block;font-size:9px;font-family:ui-monospace,Menlo,monospace;margin-top:2px;}
.ri .rf i{font-style:normal;color:#6b5c44;}
.ri .rf i.up{color:#2f5d34;} .ri .rf i.dn{color:#8c2f22;}
.then{white-space:normal;margin-top:10px;border:2px solid var(--ink);background:#f1e4c4;padding:8px 10px;}
.then>b{display:block;font-size:8.6px;letter-spacing:1.8px;text-transform:uppercase;color:var(--rust);margin-bottom:5px;}
.then .y{display:flex;gap:8px;padding:3px 0;border-bottom:1px dotted var(--line);font-size:11.6px;line-height:1.36;}
.then .y:last-child{border-bottom:none;}
.then .y b{flex:0 0 58px;font-family:ui-monospace,Menlo,monospace;font-size:10px;color:var(--rust);padding-top:1px;}
.exp>b{display:block;font-size:8.6px;letter-spacing:1.8px;text-transform:uppercase;color:var(--rust);margin-bottom:5px;}
.exp textarea{width:100%;height:200px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:9.8px;line-height:1.45;
 border:2px solid var(--ink);background:#fffdf3;padding:7px;resize:vertical;color:var(--ink);}
.expb{display:flex;gap:7px;margin:7px 0 5px;}
#expmsg{font-size:10.4px;font-style:italic;line-height:1.35;color:#4a3b2c;margin-bottom:7px;}

/* scene motion */
.smk{animation:smk 3.4s linear infinite;transform-box:fill-box;transform-origin:50% 100%;}
.smk:nth-of-type(2n){animation-delay:-1.4s;}
@keyframes smk{0%{transform:translate(0,0) scale(.5);opacity:.7}100%{transform:translate(-6px,-18px) scale(1.6);opacity:0}}
.flk{animation:flk 1.3s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%;}
.flk:nth-of-type(2n){animation-delay:-.6s;}
@keyframes flk{0%,100%{transform:scale(1,1)}40%{transform:scale(.9,1.12)}70%{transform:scale(1.06,.92)}}
.sway{animation:sway 4.6s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%;}
.sway:nth-of-type(2n){animation-delay:-2.1s;}
.sway:nth-of-type(3n){animation-delay:-3.3s;}
@keyframes sway{0%,100%{transform:rotate(-1.3deg)}50%{transform:rotate(1.3deg)}}
.shout{animation:shout .5s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%;}
.shout:nth-of-type(2n){animation-delay:-.25s;}
@keyframes shout{from{transform:translateY(0)}to{transform:translateY(-3px)}}
.march{animation:march 20s linear infinite;}
@keyframes march{from{transform:translateX(0)}to{transform:translateX(-430px)}}
.walk{animation:walk .5s steps(2) infinite;transform-box:fill-box;transform-origin:50% 100%;}
@keyframes walk{0%{transform:rotate(-3deg)}100%{transform:rotate(3deg)}}
.glow{animation:glow 3s ease-in-out infinite;}
@keyframes glow{0%,100%{opacity:.85}50%{opacity:.5}}
.twinkle{animation:twk 2.6s ease-in-out infinite;}
.twinkle:nth-of-type(3n){animation-delay:-1.2s;}
@keyframes twk{0%,100%{opacity:.9}50%{opacity:.25}}
.water{stroke-dasharray:14 10;animation:water 2.4s linear infinite;}
@keyframes water{to{stroke-dashoffset:-48}}
.loom{animation:loom 1.6s ease-in-out infinite;}
@keyframes loom{0%,100%{transform:translateX(0)}50%{transform:translateX(26px)}}
.drift{animation:drift 24s linear infinite;}
@keyframes drift{from{transform:translateX(-80px)}to{transform:translateX(720px)}}
.belly{animation:belly 2.2s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 50%;}
@keyframes belly{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
.limb{animation:limb 1.8s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%;}
@keyframes limb{from{transform:rotate(-4deg)}to{transform:rotate(4deg)}}
.raise{animation:raise 2.8s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%;}
@keyframes raise{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.pt .hd{transform-box:fill-box;transform-origin:50% 94%;animation:psway 4.4s ease-in-out infinite;}
@keyframes psway{0%,100%{transform:rotate(-1deg)}50%{transform:rotate(1.1deg) translateY(-4px)}}
.pt .mo{transform-box:fill-box;transform-origin:50% 0%;animation:pchew .52s ease-in-out infinite;}
@keyframes pchew{0%,100%{transform:scaleY(.3)}50%{transform:scaleY(1)}}
.pt .lid{animation:plid 5.6s steps(1) infinite;}
@keyframes plid{0%,95%{opacity:0}96%,98%{opacity:1}99%,100%{opacity:0}}
@media (prefers-reduced-motion:reduce){
 .smk,.flk,.sway,.shout,.march,.walk,.glow,.twinkle,.water,.loom,.drift,.belly,.limb,.raise,
 .yell,.card,.pt .hd,.pt .mo,.pt .lid{animation:none}}
</style>
</head>
<body>
<div id="stage">
  <header>
    <div class="mast"><h1 id="mast">The Annals of the Plebs · 495 BC</h1><span id="actTag">Act I</span></div>
    <div class="voices" id="voices"></div>
    <div class="meters" id="meters"></div>
    <div id="strip" role="img" aria-label="The hill, the city and the enemy"></div>
  </header>
  <main id="art" role="img" aria-label="Scene illustration"></main>
  <section>
    <div class="tags"><b id="who"></b><span id="stat"></span></div>
    <div id="say" aria-live="polite"></div>
    <div id="def" role="status"></div>
    <div class="hr"></div>
    <div id="ui"></div>
  </section>
  <div id="ovl" role="dialog" aria-label="Incoming reactions" aria-live="polite">
    <div class="head"><b>What Rome says</b><span>angriest first ↓</span></div>
    <div id="cards"></div><div id="record"></div>
    <button class="go" style="margin-top:9px" onclick="dismiss()">Hear it out &amp; go on →</button>
  </div>
</div>
<script>
/* ═══ GLOSSARY ═══ Every dotted word opens one of these. Written for a seventh-grade
   reader who has never seen a movie about Rome. */
const GLOSS={
 plebs:"The plebeians, or 'plebs' for short: most of the people of Rome. Farmers, potters, bakers, blacksmiths, soldiers. Free citizens, but shut out of almost every kind of power.",
 patrician:"A member of one of Rome's old noble families. Only patricians could be priests, judges, senators or consuls. Nobody could become one. You were born a patrician or you were not.",
 fathers:"What the patricians in the Senate called themselves: the patres, 'the fathers.' As if the rest of Rome were their children.",
 senate:"A council of about three hundred older patricians. It had no army of its own, but it decided almost everything, and the consuls did what it advised.",
 consul:"One of the two men who ran Rome for a year. They commanded the army and acted as judges. In these years, consuls were always patricians.",
 nexum:"Debt-bondage. If you borrowed and could not pay, you could promise your own body as payment. Then the lender owned your work, and could chain you, until the debt was 'worked off.' It almost never was.",
 nexus:"A man held in nexum. A free Roman citizen, chained in another man's workshop because he owed money.",
 as:"The as was Rome's money: at this time, a lump of bronze weighed on a scale. It took a lot of them to buy an ox.",
 legion:"Rome's army. Every citizen who owned a little property had to serve, and had to bring his own spear, shield and helmet. No pay in these years.",
 levy:"The call-up. Each spring the consuls ordered every man of fighting age to the Field of Mars to be sworn into the army. Refusing was a crime.",
 oath:"The sacramentum: the soldier's sacred oath to follow his consul. Romans believed breaking it would bring the anger of the gods on the whole city.",

const GLOSS_NAME={plebs:'plebeians',sacredmount:'Sacred Mount',as:'as (bronze money)',
 tables:'Twelve Tables',nexus:'nexus (bondsman)',fathers:'the Fathers',tabernae:'tabernae (shops)'};
const GL=(k,d)=>`<span class="gl" data-k="${k}" role="button" tabindex="0"`+
  ` aria-label="What does ${d} mean?">${d}</span>`;
const parse=s=>String(s).replace(/\[\[(\w+)\|([^\]]+)\]\]/g,(m,k,d)=>GL(k,d))
                .replace(/\[\[(\w+)\]\]/g,(m,k)=>GL(k,k));
// Beat text may carry {{FLAG?text if set|text if not}} so a later act can tell the
// truth about a choice an earlier one recorded.
const fill=t=>String(t).replace(/\{\{(\w+)\?([^|}]*)\|([^}]*)\}\}/g,(m,f,y,n)=>S.flags[f]?y:n);
// ~~text~~ is a sensory aside: what it smells and sounds like. It renders as its own box.
const md=s=>parse(String(s))
  .replace(/\n?~~([^~]+)~~\n?/g,'<span class="sense">$1</span>')
  .replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>')
  .replace(/\*([^*]+)\*/g,'<em>$1</em>');

/* ═══ STATE ═══ one object for all four acts, never reset.

     GRAIN  grain days    food in the camp. Drains each beat on the hill (Acts II & IV).
     FEAR   their fear    how badly the Fathers need you: the enemy at the border.
                          It is your leverage. It sets what the Senate will give.
     NAME   your name     the family's name. Carries from Lucius to his grandson.
     PEACE  no blood      100 means no Roman has killed a Roman. Low ends the game.
     OUT    engine        true while the plebs are camped outside the city.
     rel/mood             the five voices.
     flags                decisions a later act asks about. */
const S={HILL:24,GRAIN:9,FEAR:30,NAME:40,PEACE:100,act:1,OUT:false,PRE:false,

const METERS=[['HILL','With you',v=>v+'%'],['GRAIN','Grain',v=>(S.act>=3&&!S.OUT)?'—':v+'d'],

const REL_D={FURIOUS:-5,ANGRY:-2,COLD:0,GRUDGING:2,CHEERING:4};
const relBand=n=>n>=8?'CHEERING':n>=3?'GRUDGING':n>=-2?'COLD':n>=-8?'ANGRY':'FURIOUS';
const warnOf=k=>(k==='HILL'&&S.HILL<35)||(k==='GRAIN'&&S.OUT&&S.GRAIN<=3)||

  document.getElementById('voices').innerHTML=ORDER.map(k=>{

/* ═══ THE STRIP ═══ the argument of the whole game in one bar: the plebs on the hill,
   the city without them, and the enemy at the border. Your power was never the walking
   out. It was that Rome without you has no army. */
function drawStrip(){
  const out=S.OUT, n=Math.max(1,Math.round(S.HILL/10));
  let hill=`<path d="M0 50 Q60 14 120 22 Q170 28 200 50 Z" fill="${out?'#a7935e':'#bcae82'}"/>`;
  for(let i=0;i<(out?n:0);i++){
    const x=24+i*16, y=40-Math.sin((x/200)*Math.PI)*16;
    hill+=`<path d="M${x-6} ${y+6} L${x} ${y-3} L${x+6} ${y+6} Z" fill="#e8dcc0" stroke="#5a4428" stroke-width=".8"/>`;
    if(i%3===1) hill+=`<circle class="flk" cx="${x+9}" cy="${y+5}" r="1.8" fill="#e07a2a"/>`;
  }
  if(!out) for(let i=0;i<3;i++) hill+=`<rect x="${70+i*22}" y="${26+i%2}" width="2" height="5" fill="#6b5a3a"/>`;
  // the city
  let city=`<rect x="232" y="26" width="196" height="24" fill="#d6c39a" stroke="#6b5434" stroke-width="1"/>`;
  for(let i=0;i<7;i++) city+=`<rect x="${236+i*28}" y="20" width="10" height="7" fill="#d6c39a" stroke="#6b5434" stroke-width="1"/>`;
  city+=`<path d="M300 26 L330 12 L360 26 Z" fill="#b8543a"/><rect x="306" y="26" width="48" height="12" fill="#efe6d2"/>`;
  for(let i=0;i<5;i++) city+=`<rect x="${309+i*10}" y="26" width="3" height="12" fill="#c9bb9c"/>`;
  const smokes=out?1:5;
  for(let i=0;i<smokes;i++) city+=`<circle class="smk" cx="${248+i*36}" cy="22" r="3" fill="#9a8f80" opacity=".6"/>`;
  if(out) city+=`<text x="330" y="47" font-size="6.5" text-anchor="middle" fill="#5a3a22" font-family="Georgia">empty streets</text>`;
  // the enemy: the higher their fear, the closer the fires
  const miles=Math.max(2,Math.round(30-S.FEAR*0.28));
  const ex=640-Math.min(170,S.FEAR*1.8), fires=Math.max(1,Math.round(S.FEAR/14));
  let foe='';
  for(let i=0;i<fires;i++){
    const x=ex+(i%4)*14+(i>3?7:0), y=i>3?44:36;
    foe+=`<circle class="flk" cx="${x}" cy="${y}" r="2.4" fill="#d9542a"/>`+
         `<line x1="${x+4}" y1="${y+6}" x2="${x+4}" y2="${y-9}" stroke="#4a3420" stroke-width="1"/>`+
         `<path d="M${x+2.5} ${y-9} L${x+4} ${y-13} L${x+5.5} ${y-9} Z" fill="#6a6a6a"/>`;
  }
  const foeName=S.act<=2?'THE VOLSCI':'AEQUI &amp; SABINES';
  const cap=S.PRE?'Fields feed the legion · the legion guards the walls · the plebs are both'
   : out?`The city is empty. Rome has no army without you. The enemy: ${miles} miles out.`
   : `The plebs are in the city. Enemy fires ${miles} miles out.`;
  document.getElementById('strip').innerHTML=`<svg viewBox="0 0 660 66" aria-hidden="true">
   <rect width="660" height="66" fill="#eadfc2"/>
   <text x="8" y="10" font-size="7" letter-spacing="1.5" fill="#8a2b1d" font-family="Georgia" font-weight="700">THE HILL</text>
   <text x="330" y="10" font-size="7" letter-spacing="1.5" fill="#8a2b1d" font-family="Georgia" font-weight="700" text-anchor="middle">ROME</text>
   <text x="652" y="10" font-size="7" letter-spacing="1.5" fill="#8a2b1d" font-family="Georgia" font-weight="700" text-anchor="end">${foeName}</text>
   ${hill}${city}${foe}<line x1="0" y1="50" x2="660" y2="50" stroke="#8a7650" stroke-width="1"/>
   <text x="330" y="61" font-size="8" text-anchor="middle" fill="#3a2a1a" font-family="Georgia" font-style="italic">${cap}</text></svg>`;
}

/* ═══ ART ═══ every scene is drawn from a handful of parts: people, buildings, fire,
   hills. Seeded so a crowd stands in the same place every time it is drawn. */
let SEED=7;
const rnd=()=>{SEED=(SEED*16807)%2147483647;return (SEED-1)/2147483646;};
const wrap=(inner,defs='')=>`<svg viewBox="0 0 660 300" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><defs>${defs}</defs>${inner}</svg>`;
const skyG=(a,b,c)=>`<linearGradient id="sk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${a}"/>`+
  (c?`<stop offset=".6" stop-color="${b}"/><stop offset="1" stop-color="${c}"/>`:`<stop offset="1" stop-color="${b}"/>`)+`</linearGradient>`;
const SKY='<rect width="660" height="300" fill="url(#sk)"/>';
const TUNICS=['#9c4a32','#7a6a4a','#b0864a','#6a5a7a','#8a7a5a','#a86a3a','#5e6e52','#b9a27a'];
const SKINS=['#d8a676','#c58b5c','#e0b48a','#b97c50','#dcae82'];

// A person standing with feet at (x,y). o.arms: down | up | one | point | out | hold | fold
function person(x,y,s,o={}){
  const sk=o.skin||'#d8a676', tu=o.tunic||'#9c4a32', hr=o.hair||'#2e1c10';
  const st=`stroke="${sk}" stroke-width="3.6" stroke-linecap="round"`;
  const A={down:[[-11,-44,-14,-25],[11,-44,14,-25]],up:[[-11,-44,-19,-64],[11,-44,19,-64]],
    one:[[-11,-44,-14,-25],[11,-44,17,-66]],point:[[-11,-44,-14,-25],[11,-43,30,-46]],
    out:[[-11,-44,-26,-38],[11,-44,26,-38]],hold:[[-11,-44,-14,-26],[11,-44,15,-34]],
    fold:[[-11,-44,4,-36],[11,-44,-4,-36]],grab:[[-11,-44,-14,-25],[11,-43,32,-38]]}[o.arms||'down'];
  let g=`<line x1="-4" y1="-22" x2="-5" y2="-1" ${st}/><line x1="4" y1="-22" x2="5" y2="-1" ${st}/>`+
    `<path d="M-8 0 L-2 0 M2 0 L8 0" stroke="#3a2614" stroke-width="2.4"/>`;
  if(o.back){ // seen from behind, tunic pulled down to the waist: the whip marks
    g+=`<path d="M-12 -33 L12 -33 L14 -18 L-14 -18 Z" fill="${tu}"/>`+
      `<path d="M-11 -47 Q0 -50 11 -47 L12 -33 L-12 -33 Z" fill="${sk}"/>`+
      `<path d="M-8 -45 L6 -36 M-4 -46 L9 -39 M-9 -41 L4 -34 M-6 -38 L8 -45" stroke="#a3231a" stroke-width="1.3"/>`;
  } else if(o.toga){
    g+=`<path d="M-12 -47 L12 -47 L15 -7 L-15 -7 Z" fill="${o.toga}"/>`+
      `<path d="M-11 -47 L14 -22 M-13 -30 L13 -14" stroke="rgba(0,0,0,.16)" stroke-width="1.6" fill="none"/>`+
      (o.stripe?`<path d="M-15 -8 L15 -8" stroke="#7a1e3a" stroke-width="2.6"/><path d="M-11 -47 L-14 -9" stroke="#7a1e3a" stroke-width="2"/>`:'');
  } else {
    g+=`<path d="M-11 -47 L11 -47 L13 ${o.dress?-6:-20} L-13 ${o.dress?-6:-20} Z" fill="${tu}"/>`+
      `<line x1="-11" y1="-32" x2="11" y2="-32" stroke="rgba(0,0,0,.25)" stroke-width="1.5"/>`;
  }
  if(o.shield) g+=`<ellipse cx="-13" cy="-30" rx="9" ry="13" fill="#9a3a24" stroke="#c9a04a" stroke-width="2"/><circle cx="-13" cy="-30" r="2.4" fill="#c9a04a"/>`;
  A.forEach(a=>g+=`<line x1="${a[0]}" y1="${a[1]}" x2="${a[2]}" y2="${a[3]}" ${st}/>`);
  if(o.spear){const hx=o.arms==='hold'?15:16;
    g+=`<line x1="${hx}" y1="-82" x2="${hx}" y2="0" stroke="#5a3a1a" stroke-width="1.8"/><path d="M${hx-2.4} -82 L${hx} -91 L${hx+2.4} -82 Z" fill="#8a8a8a"/>`;}
  if(o.chain) g+=`<path d="M-5 -2 Q-18 6 -30 4" stroke="#5a5a5a" stroke-width="1.6" stroke-dasharray="2.4 1.2" fill="none"/>`;
  if(o.tablet) g+=`<rect x="-20" y="-34" width="9" height="11" fill="#c9a46a" stroke="#6a4a24" stroke-width="1"/>`;
  g+=`<circle cx="0" cy="-54" r="7.4" fill="${sk}"/>`;
  const h=o.head||'hair';
  if(o.back) g+=`<path d="M-7.4 -55 Q-8 -63 0 -63 Q8 -63 7.4 -55 Q8 -47 0 -47 Q-8 -47 -7.4 -55 Z" fill="${hr}"/>`;
  else if(h==='helmet') g+=`<path d="M-8 -54 Q-8 -64 0 -64 Q8 -64 8 -54 Z" fill="#b88a3a"/><path d="M-5 -64 Q0 -72 5 -64" fill="#a32a1c"/>`;
  else if(h==='veil') g+=`<path d="M-9 -46 Q-11 -64 0 -64 Q11 -64 9 -46 L7 -46 Q8 -58 0 -58 Q-8 -58 -7 -46 Z" fill="${o.veil||'#5a6b8a'}"/>`;
  else if(h!=='bald') g+=`<path d="M-7.4 -55 Q-8 -63 0 -63 Q8 -63 7.4 -55 Q4 -59 0 -59 Q-4 -59 -7.4 -55 Z" fill="${hr}"/>`;
  if(o.beard&&!o.back) g+=`<path d="M-6 -52 Q-6 -44 0 -44 Q6 -44 6 -52 Q3 -49 0 -49 Q-3 -49 -6 -52 Z" fill="${o.beard}"/>`;
  const inner=o.cls?`<g class="${o.cls}">${g}</g>`:g;
  return `<g transform="translate(${x} ${y}) scale(${o.flip?-s:s} ${s})">${inner}</g>`;
}
// A crowd between x0 and x1 at depth y. Random clothes, same every time.
function crowd(n,x0,x1,y,s,o={}){
  SEED=o.seed||11; let g='';
  for(let i=0;i<n;i++){
    const x=x0+(x1-x0)*(i+rnd()*.6)/n, yy=y+rnd()*8;
    const woman=rnd()<(o.women||.25);
    g+=person(x,yy,s*(.92+rnd()*.14),{tunic:TUNICS[Math.floor(rnd()*TUNICS.length)],
      skin:SKINS[Math.floor(rnd()*SKINS.length)],hair:rnd()<.2?'#8a8278':'#2e1c10',
      head:woman?'veil':(o.helm&&rnd()<.6?'helmet':'hair'),dress:woman,
      veil:['#5a6b8a','#7a5a3a','#6a7a5a','#8a4a3a'][Math.floor(rnd()*4)],
      beard:!woman&&rnd()<.5?'#3a2414':null,spear:o.spear&&!woman&&rnd()<.5,
      arms:o.arms?o.arms[Math.floor(rnd()*o.arms.length)]:'down',cls:o.cls});
  }
  return g;
}
function temple(x,y,w,h,o={}){
  const cols=o.cols||6, col=o.col||'#e8dcc4', step=h*.12, top=y-h*.78;

{act:1,scene:'chain',tag:'Rome, 495 BC',who:'How Rome works',pre:true,
 text:"Forget the Rome of marble, emperors and gladiators. That Rome is five hundred years away.\n\nThis Rome is a small, muddy city of mud-brick houses and painted wooden temples on seven hills beside the river Tiber. Its streets smell of smoke, animals and the open drain.\n\nTwo kinds of Romans live here. A few old families are [[patrician|patricians]]. Only they can be priests, judges, [[senate|senators]] or [[consul|consuls]]. Everyone else, the farmers, potters, bakers and blacksmiths, is a [[plebs|plebeian]].\n\nIn spring the plebeians plant. In summer they pick up their own spears and fight Rome's wars. In autumn they come home and find out how much they owe.\n\n**Up top are the five voices of Rome** and how each one feels about you. Under them are your meters: how many would follow you, how much grain you have, how badly the patricians need you, what your name is worth, and whether any Roman has killed another. **Tap any dotted word** to see what it means.",
 type:'go'},
{act:1,scene:'forum',tag:'The Forum, 495 BC',who:'The old centurion',
 text:"~~The [[forum|Forum]] smells of wet stone, woodsmoke and the fish sauce old women sell out of clay jars. A pig squeals at the altar of Saturn. Bronze lumps clink on the money-changers' scales.~~\nA man staggers out of a side street into the middle of it all. His grey beard is long and matted. His tunic is a rag. He is so thin you can count his ribs.\n\nSomeone knows him: *He was a [[centurion]]. He fought in twenty-eight battles.*\n\nThe old man climbs onto a step and tells his story. While he was off at war, raiders burned his farm and drove off his cattle. The tax came due anyway, so he borrowed. The interest grew faster than his barley. The lender took his land. Then, under the law of [[nexum]], he took the man himself.\n\nThen the old man turns around and pulls his tunic down. His chest carries scars from the enemy. His back carries fresh red welts from his lender's whip.\n\nThe Forum *roars*.\n\nYou are **Lucius Sicinius**, a plebeian soldier, standing in that crowd. You have fought beside men like him. You owe money too.",
 type:'go'},
{act:1,scene:'chains',tag:'A week later',who:'A neighbor in chains',
 text:"~~It is dark and hot inside the workshop. Flour dust hangs in the single beam of light. The millstone grinds with a low, endless groan, and the chain on the man's ankle clinks with every step.~~\nYour neighbor Titus has been taken. After a bad harvest he borrowed four hundred [[as|bronze]]. Now he is a [[nexus]]. All day he walks in circles pushing a mill bar in his lender's workshop, chained at the ankle, while his wife and two daughters try to farm his field without him.\n\nHe is a free Roman citizen. He is owned until he pays. And he can never pay while he is chained.\n\nHis wife has come to your door. She has not asked for anything. She just stands there.",

 opts:[
  {l:'Gather the men and break him out tonight.',

{act:1,scene:'levy',tag:'495 – 494 BC',who:'A promise, then another',bump:{FEAR:10},
 text:"Then news comes up from the south: the [[volsci|Volsci]] are coming, with an army.\n\nThe consuls call the [[levy]]. Nobody comes. The plebs stand in the Forum with their arms folded. *Why should we fight for Rome when Rome chains us the minute we come home?*\n\nSo the consul Servilius makes a promise. No Roman may be chained for debt, or have his land sold, while he is away at war. The workshops open. The men march out. They win.\n\nThey come home with captured spears and captured cattle. And the other consul, Appius Claudius, hands every debtor straight back to his lender, as if no promise had ever been made.\n\n~~That night the doors on the plebeian streets stay shut and the lamps burn late. The whole Aventine smells of lamp oil and anger.~~\nThe next year it happens again: a new war, a new promise, a new victory. This time a [[dictator]], Manius Valerius, gives his word. He even means it. The [[senate|Senate]] breaks it anyway.",

{act:1,scene:'council',tag:'Nights on the Aventine',who:'Who is in this?',
 text:"~~The meetings happen after dark on the Aventine and Esquiline hills, in yards that smell of goats and crushed olives. Men squat by small fires and keep their voices low. When a dog barks, everyone goes silent.~~\nEveryone agrees on what is wrong. Nobody agrees on what to do about it.\n\nThe debtors want their chains off and their debts wiped out. The plebeians who own workshops, the smiths and potters and the man who sells rope, want something else: a say in how Rome is run. And some of them lend money themselves.\n\nThey are all looking at you. You were the one who stood up in the Forum and said it out loud: *enough.*",

       tr:['GRUDGING','"Fine. But somebody has to keep this orderly."'],
       he:['COLD','"So the men are out every night now. Who is watching the children?"'],
       pa:['ANGRY','"There are oaths being sworn on the Aventine. We know about it."']}},
  {l:'Bring in the traders: the plebeians with money and workshops.',
   why:['They have mules, rope, storerooms and friends in the Latin towns. Without them, a camp runs out of food in a week.',
        'Some of them are lenders. The debtors will ask why the men who hold their loans get a say in the plans.'],
   fx:{HILL:7,NAME:3,GRAIN:2},flag:'TRADERS_IN',
   rx:{db:['ANGRY','"Him? He holds my cousin\'s loan. And now he gets a vote?"'],
       so:['COLD','"As long as they bring food, I do not care who they are."'],
       tr:['CHEERING','"Finally, someone who thinks past tonight. I have twelve mules."'],
       he:['GRUDGING','"Traders mean grain. Grain matters more than speeches."'],
       pa:['ANGRY','"Men of property, joining the rabble? That is new, and it is dangerous."']}},
  {l:'Keep it small. Only men you would trust with your life.',
   why:['A secret can only be kept by a few. The Fathers cannot arrest what they do not know about.',
        'A few men cannot empty a city. When the time comes, will anyone follow a plan they never heard about?'],
   fx:{HILL:3,NAME:-2,PEACE:2},flag:'SECRET',
   rx:{db:['COLD','"Something is going on. Nobody tells me what."'],
       so:['GRUDGING','"Good. Loose talk gets men killed."'],
       tr:['COLD','"I hear there are meetings. I am not invited, apparently."'],
       he:['COLD','"My husband says nothing is happening. My husband is a bad liar."'],
       pa:['COLD','"The plebs grumble. The plebs always grumble."']}}]},
{act:1,scene:'levy',tag:'The Field of Mars, 494 BC',who:'The oath',
 text:"The Senate has a trick. Your army is still under its military [[oath]], and the oath lasts until a consul releases you. So the consuls announce that the enemy is moving again and order the legions to march out of the city.\n\n~~Thousands of men in ranks on the Field of Mars. Sweat, leather, and bronze helmets heating in the sun. Somebody's mule will not stop braying. The [[lictor|lictors]] stand at the consul's platform holding the [[fasces]].~~\nIf you march, you fight another war for men who will chain you when it is over. If you refuse, you break an oath sworn to the gods, and every Roman believes the gods punish that.\n\nA man behind you whispers: *Kill the consuls. An oath to a dead man binds no one.*\n\nAnother man says: *Or we do march. With our standards, in good order. Just not where they tell us.*",
 type:'choice',
 record:"This is close to Livy's account. He says some soldiers really did talk about killing the consuls to get free of the oath, and decided against it because a crime cannot cancel a sacred promise. Instead, 'on the advice of one Sicinius,' they marched without their consuls to a hill across the Anio, about three miles from Rome. Livy wrote more than four hundred years later, so many details are legend. The secession itself is accepted by most historians.",
 opts:[
  {l:'March out under our own standards to the hill across the Anio. Touch no one.',
   why:['You keep the oath: you are marching. You simply are not fighting. Rome finds out what it is without its army, and no one can call you a murderer.',
        'You are leaving the city with the enemy near. If the Volsci strike while you sit on a hill, the Fathers will blame every burned farm on you.'],
   fx:{HILL:14,FEAR:16,NAME:10},flag:'SECEDED',
   rx:{db:['CHEERING','"No fight. No blood. We just walk. Gods, it is beautiful."'],
       so:['CHEERING','"We kept the standards. We are still the legion. Just not theirs."'],
       tr:['GRUDGING','"Orderly, at least. My shop is locked. I am coming."'],
       he:['ANGRY','"And us? You march off to a hill and leave us in the city with them?"'],
       pa:['FURIOUS','"Desertion. Treason. Have they gone mad? Who will stand on the walls?"']}},
  {l:'Kill the consuls. An oath to a dead man binds no one.',
   why:['It ends the trick at a stroke. No oath, no army for the Senate to command, and every patrician learns that the plebs can strike back.',
        'Roman will kill Roman in the middle of the Field of Mars. There is no coming back from that. Not for you, and maybe not for the city.'],
   fx:{PEACE:-48,HILL:4,NAME:-16,FEAR:10},flag:'KILLED_CONSULS',end:'ROCK',
   rx:{db:['GRUDGING','"They had it coming. I still feel sick."'],
       so:['CHEERING','"Done. Now we hold the city."'],
       tr:['FURIOUS','"You have made us murderers. Every one of us."'],
       he:['FURIOUS','"My son was standing three rows back. Do you know what you have made of him?"'],
       pa:['FURIOUS','"Blood on the Field of Mars! Every patrician family in Rome will avenge this."']}},
  {l:'Keep the oath. Fight this war and argue when we come home.',
   why:['You keep faith with the gods and with Rome. Nobody can say the plebs abandoned the city in danger.',
        'This is exactly what happened the last two times. You will win their war and come home to the same chains.'],
   fx:{HILL:-18,FEAR:-10,NAME:-6},flag:'OBEYED',end:'OBEY',
   rx:{db:['FURIOUS','"A third time. A third promise. You fool."'],
       so:['ANGRY','"So we march. Again. For them. Again."'],
       tr:['COLD','"Well. It is the law."'],
       he:['GRUDGING','"At least nobody went to a hill in the rain."'],
       pa:['CHEERING','"Order holds. Sicinius has more sense than we feared."']}}]},
{act:1,scene:'march',tag:'494 BC',who:'End of Act One',
 text:"Nobody shouts. That is the strange part.\n\nThe army simply turns at the crossroads. It walks out through the gate, past the tombs along the road, across the bridge over the [[anio|Anio]], and up a low hill three miles from Rome. It digs a ditch. It builds a fence of sharpened stakes. And it sits down.\n\n~~Behind you the city goes quiet. No hammer rings on any anvil. No cart wheels rattle on the stones. Just the river, and the crows.~~\nThe Romans had a word for this: *secessio*, a going-apart. Nobody had ever done it before.",
 type:'end'},

/* ───────── ACT II · THE SACRED MOUNT ───────── */
{act:2,scene:'mount',tag:'The hill across the Anio',who:'The first night',out:true,
 text:"~~Night on the hill. Damp wool, wet earth, a hundred small fires. Somebody is boiling [[puls]] in a dented pot: emmer wheat, water and a pinch of salt. The frogs in the river below will not stop. A baby cries in one of the tents, and somebody laughs, and the laugh spreads, because none of you can believe what you have done.~~\nHere is what nobody in Rome has understood yet: **the plebs are the army.** You do not need to fight Rome. You only need to leave it.\n\nWithout you there is nobody to plow, nobody to bake, nobody to stand in the battle line. The patricians are a few hundred families. The enemy is at the border. Sooner or later the Fathers will have to walk out here and talk to you.\n\nThe only question is which runs out first: their nerve, or your grain.",
 type:'go'},
{act:2,scene:'mount',tag:'Day four',who:'Something to eat',drain:1,
 text:"~~The puls is getting thinner. Men chew on raw beans. Somebody caught a hare and twenty people watched him cook it.~~\nAll around the hill are farms, and the best of them belong to patricians. Barley stands ripe in their fields. Their sheep graze in plain sight.\n\nThe {{TRADERS_IN?traders who joined you say they can buy grain from the Latin towns, if the camp can scrape up the bronze.|men who own workshops did not come out with you. There are no mules and no storerooms on this hill.}}\n\nThe grain meter is up there for a reason. **When it hits zero, the hill goes home.**",
 type:'choice',
 record:"Livy says the plebs stayed quietly on the hill for several days, 'taking nothing from the fields but what they needed to eat.' Whether the camp bought food, foraged it, or simply went hungry, he does not say.",
 opts:[
  {l:'Take food from the patricians\' fields. Only what we eat, nothing more.',
   why:['It is food, it is right there, and the men who own it are the reason you are hungry.',
        'This is how the Fathers will tell the story: plebeian thieves stripped Roman farms. Some of those farmers are plebeian tenants, and the barley is theirs too.'],
   fx:{GRAIN:5,PEACE:-8,FEAR:4},flag:'FORAGED',
   rx:{db:['CHEERING','"Real bread. I had forgotten the smell."'],
       so:['GRUDGING','"We did it like soldiers. No burning. No looting."'],
       tr:['COLD','"Fine. But somebody owns those fields, and somebody will remember."'],
       he:['GRUDGING','"The children ate. I do not ask where it came from."'],
       pa:['FURIOUS','"They are stripping our estates! Bandits on Roman soil!"']}},
  {l:'Buy grain from the Latin towns, with whatever bronze the camp can raise.',
   why:['You stay honest. Nobody can call you thieves. And it shows Rome\'s neighbors that the plebs are a people worth dealing with.',
        'It is slow and it is costly. Many of the men on this hill have no bronze at all, because that is why they are here.'],
   fx:{GRAIN:4,NAME:4},flag:'BOUGHT',
   rx:{db:['COLD','"I put in my last two coins. Hope it was worth it."'],
       so:['GRUDGING','"Carts on the Latin road. Good."'],
       tr:['CHEERING','"Trade. Proper trade. This is how free men eat."'],
       he:['GRUDGING','"Slow, but it is coming."'],
       pa:['ANGRY','"They are dealing with the Latins on their own. Like a separate city."']}},
  {l:'Strict rations. One cup of emmer a day, for everyone, you included.',
   why:['Fair and clean. Nobody gets more than anyone else, and nobody can accuse you of anything.',
        'A cup of grain a day is hunger, not a meal. The weakest will drift back to the city one by one.'],
   fx:{GRAIN:2,HILL:-6},
   rx:{db:['ANGRY','"A cup a day. I had more than this in my lender\'s workshop."'],
       so:['ANGRY','"You cannot hold a hill on an empty stomach."'],
       tr:['GRUDGING','"Hard. But fair. I will give him that."'],
       he:['COLD','"I have a baby. Babies do not ration."'],
       pa:['COLD','"Let us see how long they last on a cup of grain."']}}]},
{act:2,scene:'city',tag:'Meanwhile, in Rome',who:'The empty city',bump:{FEAR:14},drain:1,
 text:"~~The streets feel wrong. Every shop has its shutters closed. No smoke rises from the bakers' ovens. A dog trots down the middle of the Sacred Way, because there is nobody left to shoo it. The cattle market is empty, and the flies have it all to themselves.~~\nA white-haired senator stands in his doorway. For the first time in his life he has to fetch his own water.\n\nRumors travel faster than people in an empty city. *The Volsci are marching. The Aequi are coming down from the mountains. The plebs on the hill will join the enemy.* None of it is true yet. Any of it could be.\n\n**Look at the bar above.** The city is empty, and the enemy's fires are creeping closer. That is your power. Not the hill itself, but the gap you left behind.",
 type:'go'},
{act:2,scene:'hearth',tag:'A house on the Aventine',who:'The families',drain:1,
 text:"~~In a two-room house on the Aventine, the loom thumps, clack, clack, as a woman beats the thread tight. Her daughter stirs the pot over the hearth. The little clay household gods watch from their shrine on the wall. There is enough emmer left for six days.~~\nMost of the men on the hill left their families behind in the city. The women are holding everything together: the fields, the animals, the debts.\n\nNow there are rumors that the Fathers might use them. They could lock the families up. Or they could simply wait for the wives to beg their husbands to come home.",
 type:'choice',
 record:"Livy does not say what happened to the families during the first secession. Roman stories often give women a deciding role, though. Two years later, he says, it was the mother and wife of the general Coriolanus who walked out to his army and turned it back from Rome. The choices here are imagined in that spirit.",
 opts:[
  {l:'Bring the families out to the hill.',
   why:['Nobody can be held hostage, and the whole city sees that the plebs are not coming back alone.',
        'More mouths and the same grain. The hill was a camp; now it is a village with babies in it.'],
   fx:{HILL:8,GRAIN:-4,FEAR:4},flag:'FAMILIES_OUT',
   rx:{db:['GRUDGING','"My wife is here. My wife is complaining about the tent. All is well."'],
       so:['GRUDGING','"A man fights harder with his family behind him."'],
       tr:['COLD','"So now we are feeding children, too."'],
       he:['CHEERING','"We go where our men go. We carried the pots out on our heads."'],
       pa:['ANGRY','"Whole families gone. Whole streets empty. This is no protest. It is a new city."']}},
  {l:'Leave them. The Fathers would never stoop to hurting women and children.',
   why:['The grain lasts longer, and it shows the Senate you trust Roman decency even now.',
        'You are betting your own family on the Fathers\' good manners. The same Fathers who chained Titus.'],
   fx:{HILL:-4,NAME:-3},
   rx:{db:['COLD','"I hope you are right about them."'],
       so:['COLD','"Nothing to be done about it."'],
       tr:['GRUDGING','"Sensible. A camp is no place for a family."'],
       he:['FURIOUS','"Decency? Ask Titus\'s wife about their decency."'],
       pa:['COLD','"We are not barbarians. Of course the families are safe."']}},
  {l:'The families stay, but the women carry word between the hill and the city.',
   why:['Nobody stops a woman carrying a basket to market. You will know everything the Senate says before they finish saying it.',
        'You are putting the women in the middle of a fight they never voted to join. If the Fathers notice, they will be the first ones punished.'],
   fx:{NAME:5,FEAR:3},flag:'WOMEN_MESSENGERS',
   rx:{db:['GRUDGING','"My sister says the senators argue all night. Ha!"'],
       so:['GRUDGING','"Better scouts than any we had in the war."'],
       tr:['GRUDGING','"Clever. Very clever."'],
       he:['GRUDGING','"So we feed the children, work the fields, and spy on the Senate. Of course we do."'],
       pa:['ANGRY','"Every market woman on the Aventine is a messenger. We are surrounded by ears."']}}]},
{act:2,scene:'council',tag:'The great fire',who:'What it is for',drain:1,
 text:"~~The whole camp has gathered around one huge fire. Every face is orange on one side and black on the other. The air smells of pine pitch and people.~~\nThe Senate has sent word that it will talk. Tomorrow one man will climb this hill to hear what you want.\n\nSo tonight you have to decide what this going-apart is **for.**\n\nEvery demand pleases somebody on this hill, and every demand costs you something with the Fathers. **Watch the faces.** Ask for too little and the debtors will feel betrayed. Ask for too much and the Senate will give you only the cheapest pieces and refuse the rest.",
 type:'demands'},
{act:2,scene:'menenius',tag:'The next morning',who:'Menenius Agrippa',drain:1,
 text:"The man they send is **Menenius Agrippa**: old, famous, a former consul. And this matters: his family were plebeians once. The Senate chose him because the plebs like him.\n\n~~He climbs the hill on foot, slowly, his white wool toga already brown with mud at the hem. No lictors. No guards. He sits down on a rock and asks for water, and someone gives him some.~~\nHe does not argue about debts. He does not mention your demands. He wipes his mouth and says: *Let me tell you a story.*",
 type:'go'},
{act:2,scene:'fable',tag:'The belly and the limbs',who:'Menenius\'s story',drain:1,
 text:"*Once upon a time,* says Menenius, *the parts of the body did not agree the way they do now. The hands, the mouth, the teeth and the feet all looked at the belly and got angry. We do all the work, they said. We fetch, we carry, we chew. The belly just sits in the middle and enjoys it all.*\n\n*So they went on strike. The hands would not lift food to the mouth. The mouth would not open. The teeth would not chew.*\n\n*And the hands and the feet and the mouth grew weak, and the whole body wasted away. Because the belly was never idle at all. It was feeding everyone.*\n\nHe looks around the fire. *The Senate is the belly. You are the limbs. Starve Rome, and you starve yourselves.*\n\nIt is a good story. People are nodding. You have to answer it.",
 type:'choice',
 record:"The fable of the belly and the limbs is the most famous part of the story. Livy tells it almost exactly like this, and Shakespeare put it in his play Coriolanus two thousand years later. Livy says it worked: the plebs were moved, and talks began. Notice what the story leaves out, though: who decides how much each limb gets fed.",
 opts:[
  {l:'"Fine. Then the belly feeds the hands too. Here is what that costs."',
   why:['You accept his picture and turn it on him. If Rome is one body, then the limbs need protecting too. It is a hard answer to refuse.',
        'You have agreed that the Senate is the belly, the part that decides who eats. Some on this hill will think you have given away too much.'],
   fx:{NAME:6},tol:4,flag:'FABLE_BARGAIN',
   rx:{db:['GRUDGING','"Ha. Feed the hands. I like that."'],
       so:['GRUDGING','"He took the old man\'s story and made it ours."'],
       tr:['CHEERING','"Now that is how you talk to a senator."'],
       he:['GRUDGING','"A body with no hands starves. Even the Fathers can follow that."'],
       pa:['GRUDGING','"He answered the fable well. Too well, perhaps."']}},
  {l:'"We are not your hands. We are Romans, the same as you."',
   why:['It is the truth, and the whole hill needed to hear somebody say it. Nobody is born to be someone else\'s limb.',
        'It turns a conversation back into a fight. If the Fathers are frightened enough, they will give way. If they are not, you have just insulted the one patrician who came up here unarmed.'],
   fx:{NAME:4,PEACE:-3},tolFear:[55,9,-6],flag:'FABLE_DEFY',
   rx:{db:['CHEERING','"Not his hands. Never again his hands!"'],
       so:['CHEERING','"Say it again, louder, so they hear it in the Forum."'],
       tr:['COLD','"True. Was it wise? We will find out."'],
       he:['COLD','"Brave words. I hope they come with bread."'],
       pa:['FURIOUS','"Menenius went up that hill in good faith and they threw it in his face."']}},
  {l:'"He is right. Rome is one body. We go home and trust the Senate."',
   why:['No more hunger and no more danger. Menenius is a decent man, and he has promised that the Senate will be fair.',
        'You walk home with a story and nothing else: no law, no officers, no guarantees. The last three promises were all broken.'],
   fx:{HILL:-30,NAME:-10},end:'BELLY',
   rx:{db:['FURIOUS','"A story. We starved on this hill for a story."'],
       so:['ANGRY','"So we march home. Same chains. Same men holding them."'],
       tr:['GRUDGING','"Peace, at least. And maybe Menenius will keep his word."'],
       he:['GRUDGING','"I want my husband home. I want this to be over."'],
       pa:['CHEERING','"Good sense prevails. The limbs return to the body."']}}]},
{act:2,scene:'menenius',tag:'The Senate answers',who:'The terms',
 text:"Menenius goes back down the hill. Two days later he climbs it again with the Senate's answer, written out by a scribe on a wax tablet.\n\n~~The whole hill goes silent. You can hear the wax creak as he opens the tablet.~~\nHe reads it aloud, item by item.",
 type:'deal'},
{act:2,scene:'oath',tag:'Dawn on the hill',who:'The sacred oath',need:'GOT_TRIBUNES',
 text:"~~Dawn on the hill. A pig, a sheep and a bull are led to a stone altar. Smoke and the smell of burning fat rise into the pink sky, and thousands of right hands rise with them.~~\nThe plebs swear an oath together, a *lex sacrata*, a sacred law: {{GOT_SACRO?whoever lays a hand on a tribune of the plebs is [[sacer|accursed]], and anyone may kill him and be innocent before the gods.|the tribunes will be protected by us, by our own fists, because the Senate refused to make them sacred.}}\n\nNow you have to choose the first [[tribune|tribunes]]: the first officials in Roman history who belong to the plebs.",
 type:'choice',
 record:"Livy says the first two tribunes were Gaius Licinius and Lucius Albinius, who then chose three more colleagues, 'among them Sicinius, who had led the secession.' Over the next centuries most tribunes came from rich plebeian families, and some historians think they ended up protecting the rich plebs more than the poor ones.",
 opts:[
  {l:'Two men who have worn the chains themselves.',
   why:['Nobody will ever have to explain to them what nexum is. The debtors will trust them completely.',
        'The Senate will look down on them, and every patrician will try to wait them out.'],
   fx:{NAME:4},flag:'POOR_TRIBUNES',
   rx:{db:['CHEERING','"Titus\'s cousin. A tribune! He still has the marks on his ankle."'],
       so:['GRUDGING','"Hard men. Good."'],
       tr:['ANGRY','"Neither of them can read. How will they argue law with senators?"'],
       he:['GRUDGING','"They know what it is to come home and find nothing to eat."'],
       pa:['FURIOUS','"Bondsmen as officers of state. What is Rome coming to?"']}},
  {l:'Two rich plebeians, men the Senate already knows.',
   why:['They can read, they can speak, and senators will actually listen to them. A tribune is only as strong as the respect he gets.',
        'Rich plebeians want rich men\'s things. Will they really fight for a debtor\'s chains to come off?'],
   fx:{NAME:2},flag:'RICH_TRIBUNES',
   rx:{db:['ANGRY','"Of course. The rich ones. It is always the rich ones."'],
       so:['COLD','"As long as they stand in the street when it counts."'],
       tr:['CHEERING','"Good, solid men. They will get things done."'],
       he:['COLD','"We will see whose side they are on."'],
       pa:['GRUDGING','"At least we will be dealing with men of substance."']}},
  {l:'Yourself and a debtor: one of each.',
   why:['The camp trusts you, and the debtor keeps you honest. Every part of the hill has someone it can go to.',
        'Now you are an officer of the plebs, sacred and untouchable, with a target on your back for the rest of your life.'],
   fx:{NAME:9},flag:'YOU_TRIBUNE',
   rx:{db:['GRUDGING','"Sicinius and one of us. That is fair."'],
       so:['CHEERING','"Sicinius led us out. Sicinius should lead us home."'],
       tr:['GRUDGING','"Not my choice. But I can live with it."'],
       he:['GRUDGING','"He brought us here. Now he can answer for us."'],
       pa:['ANGRY','"The ringleader made sacred! Untouchable! We have rewarded rebellion."']}}]},
{act:2,scene:'council',tag:'The hill, at dawn',who:'Nobody to say "I forbid"',unless:'GOT_TRIBUNES',bump:{HILL:-8,NAME:-4},
 text:"The Senate refused to give you tribunes.\n\nWhatever else you won, there is nobody whose job is to stand between a plebeian and a [[lictor]]. The next time a consul points at a man in the street, nobody will be able to step forward and say *[[veto]]*.\n\n~~The hill is quiet in a bad way. Men are rolling up their blankets without talking.~~\nThe camp is going home. Nobody wants to say what everybody is thinking: *we did all this, and we have no one to hold them to it.*",
 type:'go'},
{act:2,scene:'home',tag:'494 BC',who:'End of Act Two',
 text:"~~The walk home is the same road, backwards. Women run out of the gate to meet you. Someone is crying. Someone is already arguing about money. The bakers light their ovens, and the smell of bread reaches the bridge before you do.~~\n{{GOT_TRIBUNES?For the first time, the plebs have officials of their own. They cannot command an army. They can only stand in the street and say one word to a consul: *veto*. I forbid.|You come home with promises, and no one whose job it is to hold the Fathers to them.}}\n\nThe plebs build a temple on the Aventine to Ceres, goddess of grain, and keep their own records there. It is not the end of anything. It is the start of two hundred years of arguing.",
 type:'end'},

/* ───────── ACT III · THE BRONZE ───────── */
{act:3,scene:'grandfather',tag:'Rome, 462 BC',who:'Thirty-two years later',
 text:"~~Your grandfather's room smells of wool grease, garlic and the herb paste on his bad knee. His hands are huge and spotted. He still sleeps with his old spear beside the bed.~~\nYou are **Gnaeus Sicinius**, grandson of Lucius. You grew up in a Rome that {{GOT_TRIBUNES?has tribunes. You have never known a city without them.|still has no tribunes. The plebs have gone on fighting for them, year after year.}}\n\n{{FABLE_DEFY?*I told Menenius we were not his hands,* your grandfather says. *I would tell him again.*|*Menenius told us a story about a belly,* your grandfather says. *A good story. It took me half my life to see what it left out.*}}\n\n*We never drew a sword, boy. Remember that. Not one Roman killed another.* {{BROKE_CHAINS?He grins. *Well. We broke a door or two.*|}}\n\n*But we never got the one thing that mattered most. You know what it is?*",
 type:'go'},
{act:3,scene:'forum',tag:'462 – 452 BC',who:'The hidden law',
 text:"*The law,* your grandfather says. *Nobody can read it.*\n\nHe is right. Rome has laws, but they are not written down anywhere a plebeian can see them. They live in the memories of patrician priests and judges. If your neighbor's ox breaks your fence, or a lender says you owe him double, you go to a patrician judge, and he tells you what the law is. That day. However he likes.\n\n~~The priests pass through the Forum in their pointed wool caps. Somewhere in their houses are the lists of court days and the exact words you must say in front of a judge. Say one word wrong and you lose your case, even if you are right.~~\nIn 462 BC a tribune named Terentilius stands up and says it out loud: *Write the laws down. All of them. Put them where anyone can read them.*\n\nThe Fathers fight him for ten years. Then they send three men all the way to Greece to study the laws of Athens. And in 452 BC they offer a deal.",
 type:'go'},
{act:3,scene:'appius',tag:'452 BC',who:'The bargain',
 text:"The deal is this.\n\nFor one year, Rome will have no consuls. Instead, ten men, the [[decemvirs|decemvirs]], will rule with total power and write the laws down. While they write, there will be no tribunes and no right of [[appeal]]. The Ten cannot be stopped by anyone.\n\nAll ten will be patricians. Their leader is **Appius Claudius**, grandson of the consul who broke the promise to the debtors.\n\n~~The Senate house is cold stone and old men's breath. You can hear the senators' sandals scrape on the floor when you walk in.~~\nYour grandfather fought for tribunes. Now you are being asked to give them up, so that you can have written laws.",
 type:'choice',
 record:"Livy and Dionysius tell it this way: in 451 BC the consuls and tribunes were suspended, and ten patricians led by Appius Claudius ruled and wrote ten tables of law. A second board in 450 BC, which may have included some plebeians, added two more tables. Modern historians argue about many details, but agree that around 450 BC Rome got its first written law code.",
 opts:[
  {l:'Take the deal. Written law is worth a year without tribunes.',
   why:['Tribunes protect people one at a time, in the street. Written law protects everyone, every day, for good.',
        'You are handing ten patricians total power and trusting them to give it back. Your grandfather would ask when they ever have.'],
   fx:{NAME:4},flag:'NO_TRIBUNES',
   rx:{db:['GRUDGING','"If I can read what I owe, nobody can make it up. Fine."'],
       so:['COLD','"No tribunes for a year. I hope nobody gets dragged off in that year."'],
       tr:['CHEERING','"Written law! Contracts that mean the same thing tomorrow as today!"'],

/* ═══ THE DEMANDS ═══ Act II's great fire. Every line pleases part of the hill and
   costs something with the Fathers. The Senate grants the cheapest first, until what
   they can stomach runs out. How much they can stomach is set by their fear. */
const TERMS=[
 {id:'free',l:'Free every Roman now in chains for debt',d:'The men in the workshops walk home tonight.',v:{db:3,so:2,tr:0,he:2},c:5},
 {id:'cancel',l:'Cancel every debt in Rome',d:'Every loan wiped clean, the rich man\'s and the poor man\'s.',v:{db:5,so:2,tr:-3,he:1},c:15},
 {id:'tribunes',l:'Tribunes: officers of our own who can say "I forbid"',d:'They cannot command anyone. They can stand in the way.',v:{db:2,so:3,tr:3,he:1},c:8},
 {id:'sacro',l:'Tribunes are sacred. Harm one and die.',d:'Without this, a tribune is just a man the lictors can drag away.',v:{db:1,so:2,tr:2,he:0},c:4,needs:'tribunes'},
 {id:'land',l:'A share of the land Rome has conquered',d:'The public land, mostly grazed by patrician herds.',v:{db:4,so:3,tr:-1,he:1},c:13},
 {id:'laws',l:'Write the laws down where anyone can read them',d:'Right now only patrician priests and judges know what the law says.',v:{db:1,so:1,tr:3,he:1},c:9},
 {id:'marry',l:'Plebeians may marry patricians',d:'Right now such a marriage does not count as a real marriage.',v:{db:-1,so:0,tr:3,he:1},c:9},
 {id:'consul',l:'A plebeian may be consul',d:'The highest office in Rome. No plebeian has ever held it.',v:{db:0,so:1,tr:4,he:0},c:22}];
const picked=new Set(['tribunes','free']);
let TOLADJ=0;
const tolerance=()=>Math.round(13+S.FEAR*.36+TOLADJ);
function demandScores(set){
  const sc={db:0,so:0,tr:0,he:0,cost:0};
  TERMS.forEach(t=>{ if(!set.has(t.id)) return; if(t.needs&&!set.has(t.needs)) return;
    for(const k in t.v) sc[k]+=t.v[k]; sc.cost+=t.c; });
  return sc;
}
const refocus=id=>{const n=document.querySelector(`[data-id="${id}"]`); if(n) n.focus();};
const bandScore=n=>n>=6?'CHEERING':n>=3?'GRUDGING':n>=0?'COLD':n>=-3?'ANGRY':'FURIOUS';
function drawDemands(){
  const el=document.getElementById('terms');
  el.innerHTML=TERMS.map(t=>{const on=picked.has(t.id), dead=t.needs&&!picked.has(t.needs);
    return `<div class="tm ${on?'on':''} ${dead?'off':''}" role="checkbox" aria-checked="${on}" tabindex="0" data-id="${t.id}">
     <div class="bx">${on?'✓':''}</div><div><b>${t.l}</b><i>${t.d}${dead?' (Needs tribunes.)':''}</i></div></div>`;}).join('');
  el.querySelectorAll('.tm').forEach(n=>n.onclick=()=>{const id=n.dataset.id;
    picked.has(id)?picked.delete(id):picked.add(id); drawDemands(); refocus(id);});
  const sc=demandScores(picked), tol=tolerance(), r=sc.cost/tol;
  const thin=sc.db<3, cls=thin?'thin':r<=.8?'fair':r<=1.1?'heavy':'huge';
  const n=Math.min(20,Math.round(r*10)), bar='▮'.repeat(Math.min(n,10))+'▯'.repeat(Math.max(0,10-n))+(n>10?' '+'▮'.repeat(n-10):'');
  const msg=thin?'The debtors are most of this hill, and almost nothing here is for them. They will not hold for this.'
    : r<=.8?'The Fathers can probably swallow all of this.'
    : r<=1.1?'Right at the edge of what the Senate can stomach. A good answer to Menenius might get it over the line.'
    : 'More than the Senate will give. They will grant the cheapest items and refuse the rest.';
  document.getElementById('askline').innerHTML=`<div class="ask ${cls}"><b>What the Senate can stomach</b>
    <span class="bar" aria-hidden="true">${bar}</span><i>${msg}</i></div>`;
  const b={db:bandScore(sc.db),tr:bandScore(sc.tr),pa:r<=.6?'GRUDGING':r<=.9?'COLD':r<=1.2?'ANGRY':'FURIOUS'};
  document.getElementById('wsf').innerHTML=['db','tr','pa'].map(k=>
    `<div class="wsface">${faceSvg(k,b[k])}<span>${VOICE[k][0]}</span></div>`).join('');
  const w=[];
  w.push(sc.db>=5?'The debtors are banging their bowls. This is what they came for.'
        :sc.db>=3?'The debtors are listening. Some are not convinced.'
        :'An old debtor stands up: "And the chains? What about the chains?"');
  w.push(sc.tr>=5?'The traders are nodding. Office, law, marriage: their kind of list.'
        :sc.tr<0?'A smith mutters that if debts are wiped out, he is ruined too. He lent money as well.'
        :'The traders want something that lasts longer than this winter.');
  document.getElementById('wsp').innerHTML='<b>Around the fire</b>'+w.map(x=>`<p>${x}</p>`).join('');
}
function deliverDemands(){
  lockUI();
  S.asked=[...picked].filter(id=>{const t=TERMS.find(x=>x.id===id); return !t.needs||picked.has(t.needs);});
  const sc=demandScores(picked);
  note('Demanded: '+S.asked.map(id=>TERMS.find(t=>t.id===id).l).join('; '));
  prev={...S};
  if(sc.db<3) bump_('HILL',-8);
  if(sc.tr<0) bump_('HILL',-3);
  logFx(); hud(); advance();
}
// Run when the Senate's answer arrives: cheapest first, until tolerance runs out.
function settle(){
  const tol=tolerance(); let used=0; S.grant=[];
  const ask=S.asked.map(id=>TERMS.find(t=>t.id===id)).sort((a,b)=>a.c-b.c);
  ask.forEach(t=>{ if(t.needs&&!S.grant.includes(t.needs)) return;
    if(used+t.c<=tol){ used+=t.c; S.grant.push(t.id); } });
  S.grant.forEach(id=>S.flags['GOT_'+id.toUpperCase()]=true);
  S.used=used; S.tol=tol;
}
function dealUI(){
  settle();
  const rows=TERMS.filter(t=>S.asked.includes(t.id)).map(t=>{const ok=S.grant.includes(t.id);
    return `<div class="it"><span class="k">${t.l}</span><span class="v ${ok?'yes':'no'}">${ok?'Granted':'Refused'}</span></div>`;}).join('');
  return `<div class="doc"><h4>The Senate to the Plebs</h4><div class="dt">On the hill across the Anio · 494 BC</div>${rows||'<div class="it"><span class="k">You asked for nothing.</span></div>'}</div>
   <button class="go" onclick="takeDeal()">Read it to the hill →</button>`;
}
function takeDeal(){
  lockUI();
  const g=new Set(S.grant), sc=demandScores(g), ref=S.asked.length-S.grant.length;
  note('The Senate granted: '+(S.grant.map(id=>TERMS.find(t=>t.id===id).l).join('; ')||'nothing'));
  const line={
    db:sc.db>=5?'"Free. They are free. Tell me again, slowly."':sc.db>=3?'"Something. Not everything. Something."':'"So the chains stay on. What were we starving for?"',
    so:g.has('tribunes')?(g.has('sacro')?'"Sacred tribunes. Let a lictor try to touch one now."':'"Tribunes, but no oath to protect them. We will protect them ourselves."'):'"No tribunes? Then who stands in the street for us?"',
    tr:g.has('laws')||g.has('marry')||g.has('consul')?'"Real gains. Things that last past this winter."':g.has('tribunes')?'"Tribunes. A beginning. The rest will take years."':'"We came all this way for this?"',
    he:g.has('free')?'"The men from the workshops are coming home. I saw one carried on his son\'s shoulders."':'"My husband says it is a victory. My pot says otherwise."',
    pa:S.used>S.tol*.8?'"We have given more than our fathers would have believed possible."':ref?'"They asked for the moon. We gave them a lamp."':'"A small price for an army."'};
  const rx={db:[bandScore(sc.db),line.db],so:[bandScore(sc.so+(g.has('tribunes')?1:-3)),line.so],
    tr:[bandScore(sc.tr),line.tr],he:[bandScore(sc.he+1),line.he],
    pa:[S.flags.FABLE_DEFY?'FURIOUS':S.used>S.tol*.8?'ANGRY':'COLD',line.pa]};
  const fx={NAME:S.grant.length*2-ref*2,HILL:Math.round((sc.db+sc.so+sc.tr)/2)-4,FEAR:-12};
  apply(fx,rx,"In the real settlement of 494 BC the plebs won tribunes of their own, made sacred by oath, and probably some relief for the worst debts. Written law took until about 450 BC. Marriage between patricians and plebeians was allowed in 445 BC. The first plebeian consul was elected in 366 BC. Nexum was abolished in 326 BC. Land reform was still getting people killed three hundred years later.");
}

const fought=new Set();
function tabBudget(){
  let b=4;
  if(S.flags.RICH_TRIBUNES||S.flags.YOU_TRIBUNE) b++;
  if(S.flags.PLEB_DECEMVIRS) b++;
  if(S.NAME>=60) b++;
  if(S.flags.REFUSED_TEN) b--;
  return b;
}
function tabScores(){
  const sc={db:0,so:0,tr:0,he:0,pa:0};
  TABLETS.forEach(t=>{ if(fought.has(t.id)) for(const k in t.v) sc[k]+=t.v[k]; });
  return sc;
}
function drawTables(){
  const B=tabBudget(), left=B-fought.size;
  document.getElementById('tbud').textContent=left+' of '+B+' left';
  const el=document.getElementById('tabs');
  el.innerHTML=TABLETS.map(t=>{const on=fought.has(t.id), off=!on&&left<=0;
    return `<div class="tab ${on?'on':''} ${off?'off':''}" role="checkbox" aria-checked="${on}" tabindex="0" data-id="${t.id}">
     <div class="th"><b>Table ${t.n}</b><span>${on?'✓ FIGHTING FOR IT':'FATHERS\' WORDING'}</span></div>
     <div class="tt">${t.t}</div>
     <span class="w f">${t.f}</span><span class="w p">Plebs' wording: ${t.p}</span>
     ${t.fix&&on?`<span class="fix">${t.fix}</span>`:''}</div>`;}).join('');
  el.querySelectorAll('.tab').forEach(n=>n.onclick=()=>{const id=n.dataset.id;
    if(fought.has(id)) fought.delete(id); else if(fought.size<tabBudget()) fought.add(id); else return;
    drawTables(); refocus(id);});
  const sc=tabScores();
  document.getElementById('wsf').innerHTML=['db','tr','he'].map(k=>
    `<div class="wsface">${faceSvg(k,bandScore(sc[k]))}<span>${VOICE[k][0]}</span></div>`).join('');
  const w=[];
  if(!fought.has('interest')&&!fought.has('debt')) w.push('The debtors want to know why nobody is fighting over the debt tablets.');
  if(!fought.has('marriage')) w.push('The traders keep pointing at Table Eleven. The marriage ban insults every plebeian family with money.');
  if(!fought.has('liberty')&&!fought.has('father')) w.push('The women at the window say nothing on this list protects a daughter.');
  if(!w.length) w.push('The crowd outside the window is mostly cheering. Mostly.');
  document.getElementById('wsp').innerHTML='<b>Outside the window</b>'+w.slice(0,2).map(x=>`<p>${x}</p>`).join('');
}
function submitTables(){
  lockUI();
  S.tabs=[...fought];
  S.tabs.forEach(id=>S.flags['TAB_'+id]=true);
  note('Fought for: '+(S.tabs.map(id=>TABLETS.find(t=>t.id===id).t).join('; ')||'nothing'));
  art.innerHTML=scBronze(12);
  const sc=tabScores(), rx={};
  ['db','so','tr','he'].forEach(k=>{
    const mine=TABLETS.filter(t=>t.q&&t.q[k]).sort((a,b)=>Math.abs(b.v[k]||0)-Math.abs(a.v[k]||0))[0];
    const line=mine?mine.q[k][fought.has(mine.id)?0:1]:'"Written down. Good or bad, it is written down."';
    rx[k]=[bandScore(sc[k]+(k==='so'?1:0)),line];
  });
  rx.pa=[sc.pa<=-10?'FURIOUS':sc.pa<=-6?'ANGRY':'COLD',
    sc.pa<=-6?'"The plebs have carved their wishes into Roman law. Our grandfathers would weep."':'"The laws of Rome, as our ancestors kept them. Now written for all to see."'];
  apply({NAME:Math.round(S.tabs.length*1.5),PEACE:2},rx,
   "The real Twelve Tables survive only in pieces, quoted by later Roman writers. Every rule on these tablets is one they quote, from summonses and debt chains to interest, flute players and acorns. Which side pushed for which line is the game's invention. The marriage ban really did go up on Table Eleven, and it was repealed only five years later, in 445 BC.");
}

const LOG=[];

const plain=t=>String(t).replace(/\[\[(\w+)\|([^\]]+)\]\]/g,'$2').replace(/\[\[(\w+)\]\]/g,'$1')
  .replace(/~~/g,'').replace(/\*\*?/g,'').replace(/&amp;/g,'&').replace(/<[^>]+>/g,'');

function logFx(){

}
const fxText=fx=>Object.keys(fx||{}).map(k=>(fx[k]>0?'+':'')+fx[k]+' '+MLABEL[k]).join(' · ');
function fxHTML(fx){

}

    `<div class="ri"><span class="rw">${e.when}</span><span class="rd">${e.what}</span><span class="rf">${fxHTML(e.fx)}</span></div>`).join('')+`</div>`;

const SCENES={chain:scChain,forum:scForum,chains:scChains,levy:scLevy,council:scCouncil,

const skip=b=>(b.need&&!S.flags[b.need])||(b.unless&&S.flags[b.unless]);

      return `<button class="btn" onclick="choose(${i})"><b>${parse(o.l)}</b>
      <i class="pro">Why you should: ${fill(o.why[0])}</i>
      <i class="con" style="margin-top:4px">Why you should not: ${fill(o.why[1])}</i></button>`;}).join('');
  } else if(b.type==='end'){

function bump_(k,v){ S[k]=Math.max(0,Math.min(100,S[k]+v)); }
let pendingEnd=null;
function choose(i){
  lockUI();
  const b=BEATS[bi], o=b.opts[i];
  if(o.flag) S.flags[o.flag]=true;
  if(o.out) S.OUT=true;
  if(o.tol) TOLADJ+=o.tol;
  if(o.tolFear) TOLADJ+=S.FEAR>=o.tolFear[0]?o.tolFear[1]:o.tolFear[2];
  if(o.end) pendingEnd=o.end;
  if(o.out&&S.GRAIN<6) S.GRAIN=6;   // the Aventine: the camp brings what it can carry
  note(o.l);
  setTimeout(()=>apply(o.fx,o.rx,b.record),120);
}
function apply(fx,rx,record){
  prev={...S};
  for(const k in (fx||{})) bump_(k,fx[k]);
  for(const k in rx){ S.rel[k]=Math.max(-20,Math.min(20,S.rel[k]+REL_D[rx[k][0]])); S.mood[k]=relBand(S.rel[k]); }
  logFx(); hud();
  const ord=ORDER.slice().sort((a,b)=>BAND[rx[a][0]].r-BAND[rx[b][0]].r);
  cardsEl.innerHTML=ord.map(k=>{const band=rx[k][0], hot=band==='FURIOUS'||band==='ANGRY';
    return `<div class="card f-${band}"><div class="fc ${hot?'yell':''}">${faceSvg(k,band)}</div>
     <div class="bd"><div class="rw"><span class="nm">${VOICE[k][0]}: ${VOICE[k][1]}</span>
      <span class="bnd">${BAND[band].e} ${BAND[band].t.toUpperCase()}</span></div><q>${rx[k][1]}</q></div></div>`;}).join('');
  const b=BEATS[bi], rec=b.savedRecord&&S.flags.VERG_SAVED?b.savedRecord:record;
  recEl.innerHTML=rec?`<b>What really happened</b><br>${rec}`:'';
  ovl.querySelectorAll('button').forEach(x=>x.disabled=false);

  ovl.querySelector('button').focus();
}
function lockUI(){

  ovl.querySelectorAll('button').forEach(b=>b.disabled=true);
}
function dismiss(){

  if(pendingEnd){ const e=pendingEnd; pendingEnd=null; ending(e); return; }
  advance();
}
function advance(){
  lockUI();
  do{ bi=Math.min(bi+1,BEATS.length-1); } while(skip(BEATS[bi])&&bi<BEATS.length-1);

}
function beginAct(n){
  lockUI(); prev={...S};
  if(n===2){ S.GRAIN=Math.max(S.GRAIN,6); }
