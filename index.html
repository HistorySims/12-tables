/* ═══ THE ANNALS ═══ Each act ends the way a Roman historian, writing centuries later,
   might have told it. Everything in it is chosen by what the player actually did. */
const AND=a=>a.length<2?a.join(''):a.slice(0,-1).join(', ')+' and '+a[a.length-1];
const TNAME={free:'freedom for the bondsmen',cancel:'the cancelling of all debts',tribunes:'tribunes of their own',
 sacro:'an oath making the tribunes sacred',land:'a share of the public land',laws:'written laws',
 marry:'the right to marry patricians',consul:'a plebeian consul'};
function annal(act){
  const F=S.flags, P=[]; let pro,con;
  if(act===1){
    P.push(`In the consulship of Appius Claudius and Publius Servilius, the debts of the plebs became a fire that could not be put out. An old centurion showed the Forum his back, and from that day the city did not sleep.`);
    P.push(F.BROKE_CHAINS?`Lucius Sicinius, a soldier of the plebs, led men by night into a lender's workshop and broke the chains of a bondsman with his own hands. The Fathers called it housebreaking. The plebs called it the first good night in a year.`
      :F.PAID_DEBT?`Lucius Sicinius, a soldier of the plebs, paid a neighbor's debt out of his own savings, which won him more friends than a hundred speeches.`
      :`Lucius Sicinius, a soldier of the plebs, went first to the consul with a petition. It did no harm. It did not do much good either.`);
    P.push(F.SWORN?`He went from street to street binding men by oath, and the meetings on the Aventine grew so large that the Senate heard of them by the next morning.`
      :F.TRADERS_IN?`He brought in plebeians of property, smiths and dealers who had mules and storerooms, though the debtors grumbled that some of them were lenders too.`
      :`He kept his circle small and his plans to himself.`);
    if(F.SECEDED) P.push(`When the consuls tried to lead the army out under its oath, the legions followed their own standards across the Anio instead and sat down on a hill three miles from the city. No blood was shed. The historians would argue for centuries over whether this was treason or the wisest thing the plebs ever did.`);
    pro=[F.BROKE_CHAINS?'He did not ask anyone\'s permission to take the chains off a Roman.':'He walked us out and never raised a hand. Nobody in Rome thought it could be done.','A debtor on the hill'];
    con=['An army that will not march when it is told is not an army. It is a mob with spears.','A senator, in the Forum'];
  } else if(act===2){
    P.push(`For days the plebs held the hill across the Anio and took from the fields ${F.FORAGED?'whatever they needed to eat, which the Fathers called theft':F.BOUGHT?'nothing at all, buying their grain from the Latin towns':'very little, living on a cup of grain a day'}. In the city, the senators fetched their own water, and the fires of the enemy crept closer.`);
    if(F.FAMILIES_OUT) P.push(`The plebs brought their wives and children out to the hill, and the city became emptier than it had been since its founding.`);
    if(F.WOMEN_MESSENGERS) P.push(`The women of the Aventine carried word between hill and city in their market baskets, and the Senate never managed to keep a single secret.`);
    P.push(`Menenius Agrippa was sent to them and told the story of the belly and the limbs. ${F.FABLE_DEFY?'Sicinius answered that the plebs were nobody\'s limbs, and the hill cheered him so loudly they heard it in the Forum.':'Sicinius answered that if Rome was one body, then the belly must feed the hands, and even the patricians laughed.'}`);
    P.push(S.grant.length?`The Senate granted ${AND(S.grant.map(id=>TNAME[id]))}.`+(S.asked.length>S.grant.length?` It refused ${AND(S.asked.filter(id=>!S.grant.includes(id)).map(id=>TNAME[id]))}.`:'')
      :`The Senate granted nothing at all.`);
    if(F.GOT_TRIBUNES) P.push(F.YOU_TRIBUNE?`Sicinius himself was among the first tribunes of the plebs.`:F.RICH_TRIBUNES?`The first tribunes were men of property, well known to the Senate.`:`The first tribunes were men who had worn the chains of nexum themselves.`);
    pro=[F.GOT_TRIBUNES?'Now there is a man in the street who can say "I forbid" to a consul. My grandfather would not have believed it.':'We showed them what Rome is without us. They will not forget it.','A plebeian, on the road home'];
    con=['We bought back our army with pieces of our own power. Our sons will pay for this.','A patrician, in the Senate house'];
  } else if(act===3){
    P.push(`Thirty years after the first going-apart, the plebs demanded that the laws be written down, and the Fathers resisted them for a decade.`);
    P.push(F.NO_TRIBUNES?`Gnaeus Sicinius, grandson of Lucius, agreed that the tribunes would be suspended while ten men wrote the laws.`
      :F.PLEB_DECEMVIRS?`Gnaeus Sicinius, grandson of Lucius, would agree to the Ten only if plebeians sat among them, and he got his way.`
      :`Gnaeus Sicinius, grandson of Lucius, refused to give up the tribunes. There were three more years of riots, and in the end the Senate appointed the Ten anyway.`);
    const won=S.tabs.map(id=>TABLETS.find(t=>t.id===id).t.toLowerCase());
    P.push(won.length?`On the tablets, the plebs won their own wording on ${AND(won)}. On everything else, the Fathers wrote what they liked.`:`On the tablets, the Fathers wrote everything.`);
    P.push(`Then the Ten would not give up their power. Appius Claudius walked the city with lictors carrying axes.`);
    pro=['A law you can read is a law you can argue about. My boy reads it to me every evening.','An old debtor, in front of Table Three'];
    con=['We traded our tribunes for bronze, and now the men who wrote the bronze carry axes.','A former tribune, quietly'];
  } else {
    P.push(`In the third year of the Ten, Appius Claudius tried to take the girl Verginia through a false claim made by his client.`);
    P.push(F.VERG_SAVED?`The crowd pointed to the Sixth Table, which Appius himself had written, and would not let her be taken. Her father found her alive.`
      :`Her father killed her with a butcher's knife rather than see her made a slave, and carried the knife back to the army.`);
    P.push(F.BURNED?`The plebs set fire to the house of Appius, and the city came closer to civil war than it ever had.`:`The armies marched back, and the plebs went out to the Sacred Mount for the second time in fifty years.`);
    P.push(F.VENGEANCE?`When the Ten resigned, the crowd was given what it wanted. Rome did not speak of that night for a long time.`
      :F.TRIAL?`The Ten were put on trial before the people. Appius died in prison before the verdict was given.`
      :`The Ten were allowed to go into exile, and the tribunes were restored the next day.`);
    pro=[F.VENGEANCE?'They got what they gave.':'We came home with our tribunes, our appeal and our bronze, and not one of us had to become what they were.','A plebeian, on the Sacred Way'];
    con=[F.VENGEANCE?'The day a crowd burned ten Romans without a trial is the day the bronze stopped meaning anything.':'Two secessions in one lifetime. Every time the plebs walk out, we give them more.','A patrician, at his door'];
  }
  return {P,pro,con};
}
function annalHTML(act){
  const a=annal(act);
  return `<div class="news"><div class="nh">${ROMAN[act]} · ${ACTNAME[act]} · as a Roman historian might tell it</div>`+
    a.P.map(p=>`<p>${p}</p>`).join('')+
    `<blockquote><q>"${a.pro[0]}"</q><cite>${a.pro[1]}</cite></blockquote>`+
    `<blockquote class="qa"><q>"${a.con[0]}"</q><cite>${a.con[1]}</cite></blockquote></div>`;
}
function endPaper(h,d,n,button){
  LOG.push({kind:'end',act:S.act,h,d,n:plain(n),article:annal(S.act).P.map(plain),meters:{...Object.fromEntries(Object.keys(MLABEL).map(k=>[k,S[k]]))}});
  art.innerHTML=scScroll(h,d); hud();
  whoEl.textContent='The Annals'; statEl.textContent=ROMAN[S.act]+' · '+ACTNAME[S.act];
  sayEl.innerHTML=annalHTML(S.act)+md(n)+actRecord(S.act); defEl.style.display='none';
  uiEl.innerHTML=button; bindGloss(); document.querySelector('section').scrollTop=0;
}
const NEXT=n=>`<button class="go" onclick="beginAct(${n})">Begin ${ROMAN[n]}: ${ACTNAME[n]} →</button>`;
const AGAIN=`<button class="go" onclick="exportLog()">Export the whole record ↓</button>`+
 `<button class="go" style="margin-top:7px" onclick="location.reload()">Play again ↻</button><div id="expbox"></div>`;
function finish(){
  const a=BEATS[bi].act;
  if(a===1){
    if(S.HILL<40) return ending('ALONE');
    endPaper('THE GOING-APART','The plebs leave the city','**On to Act II.** The army is on the hill. Now you have to keep it there.',NEXT(2));
  } else if(a===2){
    if(!S.flags.GOT_TRIBUNES&&S.HILL<60) return ending('EMPTY');
    endPaper('THE SACRED MOUNT',S.flags.GOT_TRIBUNES?'The first tribunes of the plebs':'A peace with nobody to keep it',
      '**On to Act III.** Thirty-two years pass. Lucius grows old. The fight passes to his grandson.',NEXT(3));
  } else if(a===3){
    if(S.PEACE<66&&S.flags.REFUSED_TEN) return ending('WAR');
    endPaper('THE TWELVE TABLES','The law goes up in the Forum','**On to Act IV.** The Ten will not give up their power.',NEXT(4));
  } else finalEnding();
}

/* ═══ ENDINGS ═══ */
const ENDINGS={
 ROCK:{h:'THE TARPEIAN ROCK',d:'Blood on the Field of Mars',
  n:"The consuls die in front of their own army. For one night the plebs hold the city.\n\nThen every patrician family arms its clients and its slaves. The streets fill with fighting, and when it is over the leaders of the plebs are thrown off the Tarpeian Rock, the cliff where Rome executes traitors. Lucius Sicinius is the first.\n\nThe chains stay on for another hundred and fifty years. *What really happened:* the soldiers talked about killing the consuls and decided not to. Every gain the plebs ever made came from that decision."},
 OBEY:{h:'THE THIRD PROMISE',d:'The legions march, and nothing changes',
  n:"The army marches. It wins, as it always does. It comes home, and the lenders are waiting at the gate, as they always are.\n\nThe Fathers learn a lesson from you: the plebs will grumble, but in the end they will keep the oath. It is the most dangerous thing they could have learned.\n\n*What really happened:* the army did not obey. It went to the Sacred Mount, and that is why there were tribunes in Rome for the next nine hundred years."},
 ALONE:{h:'NOBODY CAME',d:'Sicinius walks out alone',
  n:"You walk out of the gate and up the road to the Anio. Behind you come a few dozen friends. Not an army. Not even a crowd.\n\nThe Senate does not have to negotiate with forty men on a hill. It waits. After a week of rain, the forty go home.\n\nA secession only works if the city really empties. *With you* was too low: not enough of Rome believed you."},
 HUNGER:{h:'EMPTY BOWLS',d:'The hill runs out of grain',
  n:"The last of the emmer is gone. Men start slipping back down the hill at night, one by one, then whole families together, carrying their pots.\n\nThe Fathers do not have to give anything. They only have to wait one day longer than you can.\n\nEvery strike is a race between two kinds of fear: theirs, of the empty city and the enemy, and yours, of hunger. *Your grain ran out before their nerve did.*"},
 BELLY:{h:'THE BELLY WINS',d:'Home with a story and nothing else',
  n:"You walk home behind Menenius Agrippa, and the Fathers welcome you at the gate. There are speeches. There is a feast.\n\nWithin a month the lenders are back in the Forum with their scales, and the workshops are full again. There is nobody to say *veto*, because there are no tribunes. There is no written law to point to, because nobody wrote anything down.\n\n*What really happened:* the plebs listened to the fable, and then they negotiated anyway. They did not go home until they had tribunes."},
 EMPTY:{h:'A PEACE WITH NO KEEPER',d:'Promises, and no one to enforce them',
  n:"The plebs come home with some promises and no officers of their own. Within a year the old ways are back.\n\nThe lesson Rome's plebs took from this, in real history, was that gains need *someone to guard them*. That is what tribunes were: not power to command, but power to stand in the way.\n\nThe hill emptied before you had won it. Try asking for tribunes, and making them sacred."},
 WAR:{h:'ROMAN AGAINST ROMAN',d:'The riots become a war',
  n:"There have been too many fires in the street. Too many broken heads. One night the patrician gangs and the plebeian crowds meet in the Forum with swords instead of sticks, and by morning there are bodies on the Sacred Way.\n\nThe Ten use it as their excuse: Rome is too dangerous for tribunes, too dangerous for appeals, too dangerous for anything but the axe.\n\n*No blood* fell too low. Rome's plebs won almost everything they ever won without a civil war. When the civil wars finally came, four hundred years later, they destroyed the Republic."},
 TEN:{h:'THE TEN REMAIN',d:'Waiting for tyrants to leave on their own',
  n:"You wait. Verginia's father does not. The army marches without you, and without a leader it breaks apart on the road. Some of the men are punished. Some just go home.\n\nThe Ten rule for another year, and then another. Tyrants rarely step down on their own.\n\n*What really happened:* the plebs went out again, emptying the city for the second time, and the Ten fell within days."}};
function ending(key){
  const e=ENDINGS[key];
  LOG.push({kind:'ending',act:S.act,key,h:e.h});
  endPaper(e.h,e.d,`**This is one of the endings.**\n\n`+e.n,AGAIN);
}
function finalEnding(){
  const F=S.flags;
  const strength=S.tabs.length+(F.GOT_TRIBUNES?2:0)+(F.GOT_SACRO?1:0)+(F.TRIAL?1:0)+(S.NAME>=60?1:0)+(F.VERG_SAVED?1:0);
  let h,d,n;
  if(F.VENGEANCE||S.PEACE<30){
    h='THE FIRE';d='The Ten burn, and something else burns with them';
    n="The crowd gets what it asked for. The Ten die that night without a trial.\n\nThe tribunes are restored the next morning, and the right of appeal with them. But everyone in Rome now knows that when a crowd is angry enough, the law is just words on bronze.\n\n*What really happened:* Valerius talked the plebs out of it. Appius Claudius was put on trial and died in prison before the verdict. The others went into exile. The Romans were proud of that restraint for centuries.";
  } else if(strength>=9){
    h='THE VETO';d='The tribunes return, and the bronze holds';
    n="The tribunes come back, sacred again. The right of appeal comes back: any citizen sentenced by an officer can call out *I appeal to the people!* And the Twelve Tables stay in the Forum with the plebs' own words cut into them.\n\nNone of this makes Rome fair. The rich still run it. But a poor man can now read the law, point to it, and find somebody whose job is to stand in the street and say *veto*.\n\n**This is the best ending.** You kept the plebs together, won the protections that last, and never let them turn into what they were fighting.";
  } else {
    h='HALF A REPUBLIC';d='The tribunes return, but the bronze is mostly theirs';
    n="The tribunes come back, and so does the right of appeal. That much is won.\n\nBut most of the law on the bronze is the Fathers' law, and the next fight is already waiting. The plebs will have to go out again, and argue again, for another hundred and fifty years.\n\n**It is a real ending, and a decent one.** To reach the best ending, try winning more in Acts II and III: sacred tribunes, and the plebs' wording on more of the tablets.";
  }
  if(F.VERG_SAVED) n+="\n\n**Verginia lived.** Because the Sixth Table said what you fought for it to say, a crowd could point at it and refuse to move. *In the real story, she did not live.*";
  n+="\n\n"+thenHTML();
  LOG.push({kind:'ending',act:4,key:h,h});
  endPaper(h,d,n,AGAIN);
}
function thenHTML(){
  const Y=[['449 BC','The Valerio-Horatian laws restore the tribunes and the right of appeal.'],
   ['445 BC','The Canuleian law allows patricians and plebeians to marry. The ban on Table Eleven lasted five years.'],
   ['367 BC','The Licinian-Sextian laws: one of the two consuls may be a plebeian. The first, Lucius Sextius, takes office the next year.'],
   ['326 BC','Nexum is abolished. A Roman can no longer be chained for debt.'],
   ['287 BC','The last secession, to the Janiculum hill. The Hortensian law makes the plebs\' own votes binding on every Roman.'],
   ['Today','"Veto," "senate," "tribune" and "plebeian" are all still English words. Many countries have written constitutions that anyone can read.']];
  return `<div class="then"><b>What happened next</b>`+Y.map(y=>`<div class="y"><b>${y[0]}</b><span>${y[1]}</span></div>`).join('')+`</div>`;
}

/* ═══ EXPORT ═══ The whole run, as plain text, for a teacher or a notebook. */
function exportText(){
  const L=['THE SACRED MOUNT: A RECORD OF YOUR GAME','The struggle of the plebs, Rome, 495 to 449 BC',''];
  let act=0;
  LOG.forEach(e=>{
    if(e.act!==act){ act=e.act; L.push('','== '+ROMAN[act].toUpperCase()+': '+ACTNAME[act].toUpperCase()+' ('+HERO(act)+') =='); }
    if(e.kind==='choice') L.push('- '+e.when+': '+e.what+(e.fx&&Object.keys(e.fx).length?'  ['+fxText(e.fx)+']':''));
    if(e.kind==='end'){ L.push('','  '+e.h+': '+e.d); (e.article||[]).forEach(p=>L.push('  '+p)); L.push('  '+e.n.split('\n')[0]); }
  });
  L.push('','FINAL METERS: '+Object.keys(MLABEL).map(k=>MLABEL[k]+' '+S[k]).join(', '));
  L.push('VOICES: '+ORDER.map(k=>plain(VOICE[k][0])+' '+BAND[S.mood[k]].t).join(', '));
  if(S.tabs.length) L.push('TABLETS WON: '+S.tabs.map(id=>TABLETS.find(t=>t.id===id).t).join(', '));
  return L.join('\n');
}

  const t=exportText(), box=document.getElementById('expbox');

   <div id="expmsg">You can also select the text above and copy it yourself.</div></div>`;

  box.scrollIntoView({block:'nearest'});
}
function copyLog(){
  const t=document.getElementById('exptxt'), m=document.getElementById('expmsg');
  const ok=()=>m.textContent='Copied.', no=()=>{t.select();m.textContent='Your browser blocked copying. The text is selected, so press Ctrl+C or ⌘+C.';};
  try{ navigator.clipboard?navigator.clipboard.writeText(t.value).then(ok,no):no(); }catch(e){ no(); }
}
function downloadLog(){
  const m=document.getElementById('expmsg');
  try{ const a=document.createElement('a');
    a.href=URL.createObjectURL(new Blob([exportText()],{type:'text/plain'}));
    a.download='sacred-mount-record.txt'; document.body.appendChild(a); a.click(); a.remove();
    m.textContent='Downloaded as sacred-mount-record.txt.';
  }catch(e){ m.textContent='Download was blocked. Select the text above and copy it instead.'; }
}
